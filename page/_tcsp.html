<!doctype html><style>body{margin:0;background:#15171c}iframe{width:1260px;height:820px;border:0}</style>
<pre id="m" style="color:#9fe;font:12px monospace;white-space:pre-wrap"></pre>
<iframe id="f" src="/gated/page/index.html?theme=dark"></iframe>
<script>
const out = []
const log = (s) => { out.push(s); document.getElementById('m').textContent = out.join(String.fromCharCode(10)) }
const wait = (ms) => new Promise(r => setTimeout(r, ms))
const f = document.getElementById('f')
f.addEventListener('load', async () => {
  try {
    await wait(1600)
    const d = f.contentDocument
    const rows = [...d.querySelectorAll('#list .row')]
    log('列表条目=' + rows.length + '（CSP 只挡数据文件，不该影响列表）')
    const row = rows.find(r => r.textContent.includes('目录爆破'))
    row.querySelector('.row-view').click()
    await wait(500)
    const btn = [...d.querySelectorAll('.ins-actions button')].find(b => b.textContent.includes('查看原文'))
    log('查看原文=' + (btn ? (btn.disabled ? '禁用' : '可点') : '无'))
    log('禁用原因=' + (btn?.title || '—'))
  } catch (e) { log('ERROR: ' + e.message) }
})
</script>
