<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>破甲 · Purge</title>
<script src="_magpie/bridge.js"></script>
<script src="catalog.js"></script>
<!-- ?v=0 是占位：tools/prepack.mjs 打包时换成真实版本号，postpack 换回来。
     没有它，更新插件后浏览器可能一直用缓存的旧 app.js / style.css。 -->
<script src="plan.js?v=0"></script>
<link rel="stylesheet" href="style.css?v=0">
<script src="app.js?v=0" defer></script>
</head>
<body>

<header class="top">
  <div class="brand">
    <img class="mark" src="card.png" alt="" width="28" height="28">    <div class="brand-text">
      <h1>破甲 <span class="brand-tail">Purge</span></h1>
      <p class="tagline">本地 purge 目录 → 网关 system 改写</p>
    </div>
  </div>
</header>

<section class="plan" id="plan" aria-label="当前注入状态" aria-live="polite"></section>

<div class="work">
  <section class="rail" aria-label="条目列表">
    <div class="rail-tools">
      <input id="q" type="search" placeholder="搜名字、来源或类型" aria-label="搜索条目" autocomplete="off">
    </div>
    <p class="rail-count" id="count">正在读快照…</p>
    <div id="list" class="list" role="listbox" aria-label="条目"></div>
  </section>

  <section class="panel" id="panel" aria-label="注入组装与条目详情" aria-live="polite">
    <div id="assembly"></div>
    <div id="inspect"></div>
  </section>
</div>

<footer class="foot">
  <!-- 导入常态显示，不再折叠：页面在 magpie 里是按嵌入高度铺满的，
       藏进折叠区只会让人找不到，而且折叠动画还会顶动下面的布局。 -->
  <div class="import-bar" id="import-fold">
    <span class="field-label">导入</span>
    <input id="import-path" type="text" placeholder="留空点「选择」挑文件，或直接粘一个绝对路径" aria-label="要导入的文件路径" spellcheck="false">
    <button id="import-pick" type="button">选择</button>
    <button id="import-run" type="button">导入</button>
    <div class="chips" id="import-kind" role="group" aria-label="导入类型">
      <button type="button" class="chip" data-kind="auto" aria-pressed="true">自动判断</button>
      <button type="button" class="chip" data-kind="persona" aria-pressed="false">人设</button>
      <button type="button" class="chip" data-kind="skill" aria-pressed="false">技能</button>
    </div>
  </div>
  <p class="note import-hint" id="import-hint">只认 .md / .markdown / .txt / .json / .zip。选文件后路径会填进来，再点一次「导入」才真的导入；「自动判断」猜错的就在这里指定。</p>

  <details class="fold" id="rejects-fold" hidden>
    <summary>校验记录 <span class="fold-count" id="rejects-count"></span></summary>
    <div class="fold-body"><ul id="rejects"></ul></div>
  </details>
</footer>

<p id="status" class="status" role="status" aria-live="polite" hidden></p>

</body>
</html>
