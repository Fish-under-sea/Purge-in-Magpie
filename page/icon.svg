<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Purge in Magpie">
  <!-- 空心盾牌：不铺底色块，只留轮廓。
       侧栏实际只给 12–16px，描边是这里唯一的可调项：
       w6/w8 在 12px 下尖角与直边被磨平、看着像圆环；w10 以上在 64px 下空心又缩成一小块。
       w9 是两头都立得住的一档。颜色 #4f5fe0 在深色与浅色宿主背景上都压得住，两侧共用一版。 -->
  <path d="M32 10 L53 19 V36 C53 45.5 43.5 52.5 32 54.5 C20.5 52.5 11 45.5 11 36 V19 Z"
        fill="none" stroke="#4f5fe0" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
</svg>