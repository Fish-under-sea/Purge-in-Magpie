<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>magpie · 破甲（预览）</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0f1115; }
  /* 预览壳也跟着主题走：只看插件页也会点浅色，壳一直黑着会误判对比度。 */
  html[data-theme="light"], html[data-theme="light"] body { background: #f4f4f2; }
  html[data-theme="light"] .chrome { background: #ffffff; color: #3a3f4b; border-bottom-color: #e3e3e6; }
  html[data-theme="light"] .chrome b { color: #16181d; }
  html[data-theme="light"] .chrome span { color: #6b7280; }
  html[data-theme="light"] .chrome .right { color: #8a8f9a; }
  html[data-theme="light"] iframe { background: #fbfbf9; }
  body { display: grid; grid-template-rows: 38px 1fr; font: 12.5px/1.4 -apple-system, "Segoe UI", "Noto Sans SC", system-ui, sans-serif; }
  .chrome {
    display: flex; align-items: center; gap: 10px; padding: 0 14px;
    background: #101318; color: #cfd3dc; border-bottom: 1px solid #24272f;
  }
  .chrome b { font-weight: 600; color: #eef0f4; }
  .chrome span { color: #7f8696; }
  .chrome .dot { width: 8px; height: 8px; border-radius: 50%; background: #7c8cff; }
  .chrome .right { margin-left: auto; color: #6d7484; }
  iframe { width: 100%; height: 100%; border: 0; background: #15171c; display: block; }
  /* 预览壳自己不许撑宽：它一横向溢出，iframe 会跟着变宽，页面右边就被裁掉了。 */
  .chrome { min-width: 0; overflow: hidden; }
  .chrome .right { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
<div class="chrome">
  <i class="dot"></i><b>magpie</b><span>· 扩展 → 插件 → 破甲 · Purge</span>
  <span class="right" id="mode">预览：mock 宿主，不跑网关</span>
</div>
<iframe id="frame" src="/page/index.html" title="Purge in Magpie 插件页"></iframe>
<script>
  const theme = new URLSearchParams(location.search).get('theme') || 'dark'
  document.documentElement.dataset.theme = theme
  const frame = document.getElementById('frame')
  // 把预览用的开关一起转给业务页：unsent=1 抹掉「最近一次生效」，
  // 好看「确认注入」还没按下的那副样子。
  const pass = new URLSearchParams({ theme })
  for (const flag of ['unsent', 'menu', 'inline']) {
    if (new URLSearchParams(location.search).get(flag) === '1') pass.set(flag, '1')
  }
  frame.src = `/page/index.html?${pass}`
  document.getElementById('mode').textContent = `预览：mock 宿主 · ${theme === 'light' ? '浅色' : '深色'}`
  // 默认不选任何条目：右栏默认就是「注入组装」，那是最该看的一屏。
  // ?row=0 起指定第几条，用来看检查器（真机里由人点）。
  const rowParam = new URLSearchParams(location.search).get('row')
  frame.addEventListener('load', () => {
    if (rowParam === null) return
    setTimeout(() => {
      try {
        const rows = frame.contentDocument?.querySelectorAll('.row')
        ;(rows?.[Number(rowParam)] || rows?.[0])?.click()
      } catch { /* 跨域就当没有 */ }
    }, 400)
  })

  // 热重载（serve.mjs --watch）：改了 page/ 里的文件，重设 frame.src 拉一份新的，
  // 不用手点刷新。用 src 重设而不是 contentWindow.location.reload()，跨帧更稳。
  if (new URLSearchParams(location.search).get('watch') !== '0') {
    try {
      const es = new EventSource('/_reload')
      es.onmessage = () => {
        const u = new URL(frame.src, location.href)
        u.searchParams.set('t', Date.now())
        frame.src = u.toString()
        document.getElementById('mode').textContent = '预览：已重载'
        setTimeout(() => {
          document.getElementById('mode').textContent = `预览：mock 宿主 · ${theme === 'light' ? '浅色' : '深色'}`
        }, 900)
      }
    } catch { /* 没开 watching 就静默 */ }
  }
</script>
</html>
